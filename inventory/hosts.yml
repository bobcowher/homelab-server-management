---
# The LAN is DHCP, so this host's address changes. Address it by its mDNS name
# rather than a literal IP -- avahi publishes lab.local and it follows the
# lease. A pinned IP here goes stale silently: every play just fails to
# connect, and every URL assertion in verify.yml tests the wrong machine.
#
# Note mDNS resolves exactly one name; webui.lab.local and friends do not
# resolve without extra avahi configuration, which is why web routing is
# path-based on this single host.
all:
  hosts:
    lab:
      ansible_host: lab.local
      ansible_user: robertcowher
