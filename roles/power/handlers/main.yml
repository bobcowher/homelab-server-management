---
# Guarded on power_shutdown_enabled. Without the guard this handler starts the
# timer whatever the variable says: handlers run AFTER tasks, so it undoes the
# `stopped` state the enable task just set and leaves a feature that is
# disabled in config actively armed to power the box off at midnight.
- name: Restart lab-idle-shutdown timer
  ansible.builtin.systemd_service:
    name: lab-idle-shutdown.timer
    state: "{{ 'restarted' if power_shutdown_enabled | bool else 'stopped' }}"
    daemon_reload: true

- name: Restart sysstat
  ansible.builtin.systemd_service:
    name: sysstat
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
