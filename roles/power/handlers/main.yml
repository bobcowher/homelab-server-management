---
- name: Restart lab-idle-suspend timer
  ansible.builtin.systemd_service:
    name: lab-idle-suspend.timer
    state: restarted
    daemon_reload: true

- name: Restart sysstat
  ansible.builtin.systemd_service:
    name: sysstat
    state: restarted

- name: Regenerate netplan
  ansible.builtin.command: netplan generate
  changed_when: true
