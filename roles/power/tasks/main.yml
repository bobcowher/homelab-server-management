---
# sysstat is the only signal in the idle check with a MEMORY of the last hour.
# Everything else -- load average, GPU processes, beekeeper's busy flag -- is
# instantaneous and would happily suspend a box whose training run ended at
# 23:30. Without the collector running there is no history, and the script
# refuses to suspend rather than guess.
- name: Install sysstat for the activity history the idle check reads
  ansible.builtin.apt:
    name: sysstat
    state: present
    cache_valid_time: 3600

# Ubuntu ships sysstat with collection DISABLED by default via this file. The
# package being installed is not enough; without ENABLED="true" the saDD files
# are never written and sar reports "Cannot open /var/log/sysstat/saNN".
- name: Enable sysstat data collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
    owner: root
    group: root
    mode: "0644"
  notify: Restart sysstat

- name: Start the sysstat collector timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - sysstat-collect.timer
    - sysstat-summary.timer

# Artifacts from two superseded versions of this role, both from 2026-09-07.
#
# lab-idle-suspend*: the role suspended to S3 with an RTC wake before a suspend
# with live VRAM corrupted both GPUs. "suspend" in the name would now describe
# something the box never does.
#
# The Wake-on-LAN files: WoL was the remote escape hatch while the box merely
# slept. It is gone because the box now powers off completely, and a magic
# packet provably does not wake this board from S5 -- tested, no response in
# 100s. Keeping it would have meant a passing verify assertion for something
# that cannot work in the only state the box is ever in.
- name: Stop the superseded idle-suspend units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - lab-idle-suspend.timer
    - lab-idle-suspend.service

- name: Remove superseded power-management files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/lab-idle-suspend.timer
    - /etc/systemd/system/lab-idle-suspend.service
    - /usr/local/sbin/lab-idle-suspend
    - /etc/systemd/network/10-wol-enp5s0.link
    - /etc/netplan/90-wakeonlan.yaml
  register: power_cleanup
  notify: Reload systemd

# Removing the netplan override only reverts to the installer's own definition
# of the interface, so this cannot leave the box without an address. Run
# unconditionally so the rendered state matches the config even if the file was
# removed by hand. `generate` writes /run only -- `netplan apply` is never
# called on a box reachable solely over the interface being reconfigured.
- name: Re-render netplan after removing the WoL override
  ansible.builtin.command: netplan generate
  changed_when: false

- name: Install the idle-shutdown decision script
  ansible.builtin.template:
    src: lab-idle-shutdown.sh.j2
    dest: /usr/local/sbin/lab-idle-shutdown
    owner: root
    group: root
    mode: "0755"
    # Catches a Jinja variable that renders to something the shell rejects
    # before it can be installed and fire at midnight against a sleeping admin.
    validate: /bin/bash -n %s

- name: Install the idle-shutdown unit
  ansible.builtin.template:
    src: lab-idle-shutdown.service.j2
    dest: /etc/systemd/system/lab-idle-shutdown.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart lab-idle-shutdown timer

- name: Install the idle-shutdown timer
  ansible.builtin.template:
    src: lab-idle-shutdown.timer.j2
    dest: /etc/systemd/system/lab-idle-shutdown.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart lab-idle-shutdown timer

- name: Enable the overnight idle check
  ansible.builtin.systemd_service:
    name: lab-idle-shutdown.timer
    enabled: "{{ power_shutdown_enabled }}"
    state: "{{ 'started' if power_shutdown_enabled else 'stopped' }}"
    daemon_reload: true

# unattended-upgrades is scheduled at 06:53, squarely inside the shutdown
# window, and its timer is Persistent=yes. Left alone it would install security
# updates and restart services -- docker, the nvidia driver stack -- during the
# first minutes after the box is switched back on, which is exactly when it is
# wanted. Masked rather than disabled so an apt upgrade of the package cannot
# quietly re-enable it. Upgrades happen on demand instead.
- name: Mask the unattended-upgrade timer so it cannot fire at boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop:
    - apt-daily-upgrade.timer
    - apt-daily-upgrade.service
