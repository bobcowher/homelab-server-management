---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Order below is critical. Allowing 22 must happen before enabling ufw, or
# this playbook disconnects itself from a headless machine permanently.
- name: Allow SSH from the LAN
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ lan_subnet }}"

- name: Allow the native LAN services
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: "{{ lan_subnet }}"
  loop:
    - "8080"   # llama-swap
    - "5000"   # beekeeper

# Beekeeper starts a TensorBoard for each training run and assigns it the
# first free port it finds, scanning upward from 6006. These are per-run and
# short-lived, so they cannot be enumerated the way 5000 and 8080 can.
#
# Beekeeper's scan runs to 6105, so this range is deliberately narrower than
# what it can hand out. A twelfth concurrent TensorBoard would bind a port
# outside the range and go quietly unreachable -- it starts, the UI links to
# it, and the browser hangs -- but eleven at once on a two-GPU box is already
# well past normal. Widen both ends together if that ever stops being true.
- name: Allow the per-run TensorBoard ports from the LAN
  community.general.ufw:
    rule: allow
    port: "{{ tensorboard_port_range }}"
    proto: tcp
    src: "{{ lan_subnet }}"

# Containers reaching llama-swap on the host arrive with a Docker bridge
# source address, not a LAN one, so the lan_subnet rule above does not cover
# them and default-deny drops the traffic. Open WebUI talks to llama-swap over
# exactly this path.
- name: Allow containers to reach llama-swap on the host
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp
    src: "{{ docker_bridge_subnet }}"

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Install the DOCKER-USER rule script
  ansible.builtin.template:
    src: docker-user-rules.sh.j2
    dest: /usr/local/sbin/docker-user-rules.sh
    owner: root
    group: root
    mode: "0755"
  notify: Apply docker-user rules

- name: Install the DOCKER-USER systemd unit
  ansible.builtin.template:
    src: docker-user-rules.service.j2
    dest: /etc/systemd/system/docker-user-rules.service
    owner: root
    group: root
    mode: "0644"
  notify: Apply docker-user rules

- name: Enable and start the DOCKER-USER rules unit
  ansible.builtin.systemd_service:
    name: docker-user-rules
    enabled: true
    state: started
    daemon_reload: true
