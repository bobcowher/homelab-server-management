---
- name: Install the sudoers drop-in
  ansible.builtin.template:
    src: beekeeper-sudoers.j2
    dest: /etc/sudoers.d/beekeeper
    owner: root
    group: root
    mode: "0440"
    # Not optional. A parse error under /etc/sudoers.d breaks sudo for every
    # user on the host, robertcowher included, and this playbook has no other
    # route to root.
    validate: /usr/sbin/visudo -cf %s

- name: Clone the beekeeper repository
  ansible.builtin.git:
    repo: https://github.com/bobcowher/beekeeper.git
    dest: "{{ beekeeper_home }}"
    version: "{{ beekeeper_branch }}"
    # Public repo, so no deploy key. deploy.sh only ever fetches.
    update: true
  become: true
  become_user: beekeeper
  register: bk_checkout

- name: Check whether the venv already exists
  ansible.builtin.stat:
    path: "{{ beekeeper_home }}/venv/bin/python"
  register: bk_venv

- name: Run the upstream setup script
  ansible.builtin.command:
    cmd: bash setup.sh -y
    chdir: "{{ beekeeper_home }}"
  become: true
  become_user: beekeeper
  environment:
    # setup.sh searches for python3.12, 3.11, 3.10, then falls back to
    # python3. Only 3.14 exists natively and numpy<2.0 has no wheels for it,
    # so the conda env is placed ahead on PATH to supply python3.12 (spec 3.3).
    PATH: "{{ conda_prefix }}/envs/beekeeper/bin:/usr/local/bin:/usr/bin:/bin"
  # Runs only when the checkout moved or the venv is missing, so a no-op play
  # does not rebuild the environment every time.
  when: bk_checkout.changed or not bk_venv.stat.exists

# A drop-in rather than an edit to the unit itself: setup.sh writes
# beekeeper.service from its own template on every deploy, so anything added to
# the main unit would be silently reverted the next time deploy.sh runs.
#
# This host has no display. Without MUJOCO_GL, MuJoCo defaults to GLFW, asks
# X11 for a DISPLAY that does not exist, and every run that renders a frame
# dies on import. Training jobs are children of this service, so they inherit
# it.
- name: Install the beekeeper service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/beekeeper.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point MuJoCo at EGL for headless rendering
  ansible.builtin.copy:
    dest: /etc/systemd/system/beekeeper.service.d/10-headless-rendering.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible. See roles/beekeeper/tasks/main.yml.
      [Service]
      Environment=MUJOCO_GL=egl
  notify: Restart beekeeper

- name: Ensure the service is enabled and running
  ansible.builtin.systemd_service:
    name: beekeeper
    enabled: true
    state: started
    daemon_reload: true
