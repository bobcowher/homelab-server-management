---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - curl
      - ca-certificates
      - gnupg
      - restic
      - unattended-upgrades
      - python3-apt
    state: present

# restic is installed but deliberately left unconfigured. Backups are a
# deferred decision (spec section 10). Do not add repos, timers, or
# credentials here without being asked.

- name: Scope unattended-upgrades to security origins only
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible. Security pocket only.
      //
      // The distro default here includes "${distro_id}:${distro_codename}",
      // the full release pocket. Left alone it would move the NVIDIA driver
      // out from under the container toolkit and break every GPU container
      // without warning (spec 3.6).
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable unattended-upgrades periodic runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Ensure the wait-online drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Wait only for the primary link at boot
  ansible.builtin.template:
    src: wait-online-primary-link.conf.j2
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/20-lab-primary-link.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-lab.conf
    owner: root
    group: root
    mode: "0644"
    # Not optional. A typo here plus the reload handler below ends this
    # session and every future one, on a machine reachable only over SSH.
    validate: /usr/sbin/sshd -t -f %s
    # PasswordAuthentication is deliberately on: lab has no port open to the
    # internet and the firewall scopes 22 to 192.168.1.0/24, so the exposure is
    # LAN-local, and being able to get in from a device that has no key on it
    # (phone, a fresh VM, a borrowed laptop) is worth more here than refusing
    # passwords. PermitRootLogin stays off -- that is the account worth
    # brute-forcing, and it has no business accepting a password either way.
    #
    # This file is 10-, cloud-init's is 50-, and `Include sshd_config.d/*.conf`
    # reads them in lexicographic order while sshd keeps the FIRST value it
    # sees for a keyword. So this drop-in wins; do not renumber it upward
    # expecting the setting to stick.
    content: |
      PasswordAuthentication yes
      PermitRootLogin no
      X11Forwarding no
  notify: Reload sshd
