---
- name: Install the driver utilities that supply nvidia-smi
  ansible.builtin.apt:
    name: "nvidia-utils-{{ nvidia_driver_branch }}"
    state: present
    # The driver itself is already installed and its kernel modules match the
    # running kernel. Only the userspace utilities were missing (spec 2, 4).
    # Verified by dry-run before first apply: one Inst, zero Remv.

# The -server driver branch is compute-only: it ships no graphics stack, so
# there is no libEGL and no EGL vendor ICD. Anything rendering headlessly on the
# GPU -- MuJoCo with MUJOCO_GL=egl, which is how the behaviour-cloning envs
# produce frames -- fails outright without these.
#
# libnvidia-gl supplies libEGL_nvidia and /usr/share/glvnd/egl_vendor.d, and
# libegl1 supplies the libglvnd dispatch layer that loads it. The version is
# pinned to the running driver: a mismatch between the GL libraries and the
# kernel module fails at initialisation rather than at install.
- name: Find the installed driver version
  ansible.builtin.package_facts:
    manager: apt

- name: Install EGL for headless GPU rendering
  ansible.builtin.apt:
    name:
      # Pinned to the driver actually installed rather than a literal. The GL
      # libraries and the kernel module must be the same version or EGL fails
      # at initialisation, and this way a driver upgrade cannot silently leave
      # them mismatched.
      - "libnvidia-gl-{{ nvidia_driver_branch }}={{ nvidia_installed_version }}"
      - libegl1
      - libgles2
    state: present
  vars:
    nvidia_installed_version: >-
      {{ ansible_facts.packages['libnvidia-compute-' ~ nvidia_driver_branch][0].version }}

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch the NVIDIA container toolkit signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the container toolkit repository
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: [deb]
    # Distro-independent, so it cannot lag a new Ubuntu release the way a
    # codename-scoped repo would (spec 5.4).
    uris: https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH)
    suites: ["/"]
    signed_by: /etc/apt/keyrings/nvidia-container-toolkit.asc
    state: present
    enabled: true

- name: Install the container toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
    # Absent from Ubuntu's own repositories by design.

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Hold GPU and container packages against automatic upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: >-
    {{ ansible_facts.packages.keys() | select('match', apt_hold_pattern) | sort | list }}
  loop_control:
    label: "{{ item }}"
