---
# Makes lab's next hard failure diagnosable. Nothing here treats a cause as
# known: on 2026-11-08 the only NVMe went state=dead/size=0 and root went
# emergency_ro, and the kernel's messages about it were unrecoverable because
# every persistent store needs the disk that failed. See vars.yml for why
# journald, kdump and efi_pstore each came back empty, and
# nvme-dropout-2026-11-08.md for the live observation.
#
# This role does NOT reboot. The parameters below arm at the next boot, and
# until then verify.yml says so out loud rather than passing quietly.

- name: Reserve memory for ramoops on the kernel command line
  ansible.builtin.template:
    src: ramoops.cfg.j2
    dest: /etc/default/grub.d/ramoops.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Update grub

# ramoops binds to no device, so nothing auto-loads it and the reserved region
# would sit unused. Deliberately not loaded here: without reserve_mem in the
# RUNNING kernel's command line there is no region to attach to, so a load now
# would only fail and log noise. It loads on the boot that arms it.
- name: Load ramoops at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/ramoops.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible. ramoops matches no device and will not autoload.
      ramoops

# Moves /sys/fs/pstore into /var/lib/systemd/pstore early on the next boot, so
# a capture is kept rather than overwritten by the boot after it. Already
# enabled on this host; stated here so it is intent rather than luck.
- name: Keep pstore captures across reboots
  ansible.builtin.systemd_service:
    name: systemd-pstore.service
    enabled: true

# Read-only, and written in bash builtins on purpose -- see the script header.
# Root-owned because it reads /dev/kmsg.
- name: Install the crash capture script
  ansible.builtin.copy:
    src: lab-crash-capture
    dest: "{{ diag_crash_capture_bin }}"
    owner: root
    group: root
    mode: "0755"

# The capture script above is run BY HAND, after the fact. That was enough in
# theory and not in practice: on 2026-11-09 the fault was found 19 hours late
# and the kernel's record of it had already been evicted from the ring buffer
# by journald retrying writes to a read-only root about once a second. A
# capture path that depends on a human noticing loses that race, and so would
# ramoops -- an 8MB console ring recycles in about 2.5 hours at that rate.
# This watcher closes the gap: it is resident from boot and snapshots within
# seconds of the fault, before the storm overwrites the evidence.
- name: Install the resident crash watcher
  ansible.builtin.copy:
    src: lab-crash-watch
    dest: "{{ diag_crash_watch_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart lab-crash-watch

- name: Install the crash watcher unit
  ansible.builtin.template:
    src: lab-crash-watch.service.j2
    dest: /etc/systemd/system/lab-crash-watch.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart lab-crash-watch

- name: Enable and start the crash watcher
  ansible.builtin.systemd_service:
    name: lab-crash-watch.service
    enabled: true
    state: started
    daemon_reload: true
