---
# Regenerates /boot/grub/grub.cfg so the drop-in reaches the next boot. The
# drop-in on its own changes nothing; verify.yml asserts the generated file for
# that reason.
- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Restart lab-crash-watch
  ansible.builtin.systemd_service:
    name: lab-crash-watch.service
    state: restarted
    daemon_reload: true
