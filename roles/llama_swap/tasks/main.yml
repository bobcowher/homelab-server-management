---
- name: Create the Hugging Face model cache
  ansible.builtin.file:
    path: "{{ llama_cache_dir }}"
    state: directory
    owner: root
    group: ml
    # setgid so weights pulled by a backend stay group-readable
    mode: "2775"

# community.docker.docker_image fails here with "Not supported URL scheme
# http+docker" -- the collection's Python SDK path is incompatible with the
# requests/docker versions on 26.04. The CLI has no such dependency.
- name: Check whether the backend image is present
  ansible.builtin.command: "docker image inspect {{ llama_cpp_image }}"
  register: llama_image_present
  changed_when: false
  failed_when: false

- name: Pull the llama.cpp CUDA backend image
  ansible.builtin.command: "docker pull {{ llama_cpp_image }}"
  when: llama_image_present.rc != 0
  changed_when: true
  # llama-swap is only a proxy -- it starts and stops backends. Without this
  # image there is nothing to serve, and the first request would fail on a
  # cold pull inside the healthCheckTimeout window.

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/llama-swap
    state: directory
    owner: root
    group: ml
    mode: "0755"

- name: Check whether llama-swap is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/llama-swap
  register: llama_swap_installed

# Gated on the installed binary, not just `creates:` on the unarchive. The
# tarball lands in /tmp, which is cleared on reboot, so a creates-only guard
# leaves get_url re-fetching 22MB and reporting changed after every restart.
- name: Download the pinned llama-swap release
  when: not llama_swap_installed.stat.exists
  ansible.builtin.get_url:
    url: >-
      https://github.com/mostlygeek/llama-swap/releases/download/v{{ llama_swap_version }}/llama-swap_{{ llama_swap_version }}_linux_amd64.tar.gz
    dest: "/tmp/llama-swap_{{ llama_swap_version }}.tar.gz"
    checksum: "sha256:{{ llama_swap_sha256 }}"
    mode: "0644"

- name: Unpack llama-swap
  when: not llama_swap_installed.stat.exists
  ansible.builtin.unarchive:
    src: "/tmp/llama-swap_{{ llama_swap_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [llama-swap]
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/llama-swap

- name: Write the llama-swap config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/llama-swap/config.yaml
    owner: root
    group: ml
    mode: "0644"
    # llama-swap can check its own config. Same reasoning as `sshd -t` and
    # `visudo -c`: never install a config the service will choke on.
    validate: /usr/local/bin/llama-swap -config %s -validate
  notify: Restart llama-swap

- name: Install the systemd unit
  ansible.builtin.template:
    src: llama-swap.service.j2
    dest: /etc/systemd/system/llama-swap.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart llama-swap

- name: Enable and start llama-swap
  ansible.builtin.systemd_service:
    name: llama-swap
    enabled: true
    state: started
    daemon_reload: true
