[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
stdout_callback = yaml
interpreter_python = auto_silent
nocows = True

[inventory]
# A missing or unparseable inventory must be a hard error. Without this,
# ansible-playbook exits 0 on "no hosts matched" and verify.yml reports
# success against a host it never contacted.
unparsed_is_failed = True

[ssh_connection]
pipelining = True
