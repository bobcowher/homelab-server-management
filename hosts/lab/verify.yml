---
- name: Verify lab end state
  hosts: lab
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Record that this play actually executed
      ansible.builtin.set_fact:
        verify_ran: true
      tags: [always]

    - name: Host is the expected Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('26.04', '>=')
          - ansible_lsb.codename == 'resolute'
        fail_msg: >-
          Expected Ubuntu 26.04 (resolute), got
          {{ ansible_distribution }} {{ ansible_distribution_version }}
      tags: [always]

    - name: Base packages are installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' {{ item }}
      register: base_pkg
      changed_when: false
      failed_when: "'ok installed' not in base_pkg.stdout"
      loop:
        - build-essential
        - git
        - curl
        - ca-certificates
        - restic
        - unattended-upgrades
      tags: [base]

    - name: Read the unattended-upgrades configuration
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/50unattended-upgrades
      become: true
      register: uu_conf
      tags: [base]

    - name: Unattended-upgrades is scoped to security origins only
      ansible.builtin.assert:
        that:
          - "'${distro_id}:${distro_codename}-security' in (uu_conf.content | b64decode)"
          - "'\"${distro_id}:${distro_codename}\";' not in (uu_conf.content | b64decode)"
        fail_msg: >-
          unattended-upgrades would pull from the full release pocket, which
          moves the NVIDIA driver out from under the container toolkit and
          breaks every GPU container without warning (spec 3.6).
      tags: [base]

    # Ubuntu 26.04 has no /etc/timezone; systemd owns this via the
    # /etc/localtime symlink, so ask timedatectl rather than read a file.
    - name: Read the configured timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: tz_conf
      changed_when: false
      tags: [base]

    - name: Timezone matches the declared value
      ansible.builtin.assert:
        that:
          - tz_conf.stdout | trim == timezone
        fail_msg: "Timezone is {{ tz_conf.stdout | trim }}, expected {{ timezone }}"
      tags: [base]

    - name: Read the ml group
      ansible.builtin.getent:
        database: group
        key: ml
      tags: [users]

    - name: ml group has the exact fleet GID
      ansible.builtin.assert:
        that:
          - getent_group['ml'][1] | int == ml_gid
        fail_msg: >-
          ml GID is {{ getent_group['ml'][1] }}, expected {{ ml_gid }}.
          A drifted GID breaks /data ownership on restore.
      tags: [users]

    - name: Read each managed user
      ansible.builtin.getent:
        database: passwd
        key: "{{ item.name }}"
      register: user_ent
      loop: "{{ lab_users }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [users]

    - name: Each user has the exact fleet UID and expected shell
      ansible.builtin.assert:
        that:
          - item.ansible_facts.getent_passwd[item.item.name][1] | int
            == user_uids[item.item.name]
          - item.ansible_facts.getent_passwd[item.item.name][5]
            == item.item.shell
        fail_msg: >-
          {{ item.item.name }} has UID
          {{ item.ansible_facts.getent_passwd[item.item.name][1] }} /
          shell {{ item.ansible_facts.getent_passwd[item.item.name][5] }},
          expected {{ user_uids[item.item.name] }} / {{ item.item.shell }}
      loop: "{{ user_ent.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      tags: [users]

    - name: The passwordless sudo drop-in parses
      ansible.builtin.command: /usr/sbin/visudo -cf /etc/sudoers.d/robertcowher-nopasswd
      become: true
      register: rc_sudoers
      changed_when: false
      tags: [users]

    # sshd -T, not the content of 10-lab.conf: `Include sshd_config.d/*.conf`
    # merges every drop-in and sshd keeps the first value it sees per keyword,
    # so a file-content check would pass while a lexicographically earlier
    # drop-in silently overrode the setting. This asks sshd what it will
    # actually do.
    - name: Collect the effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      become: true
      register: sshd_effective
      changed_when: false
      tags: [base]

    - name: Password logins are accepted and root logins are not
      ansible.builtin.assert:
        that:
          - "'passwordauthentication yes' in sshd_effective.stdout_lines"
          - "'permitrootlogin no' in sshd_effective.stdout_lines"
        fail_msg: >-
          Effective sshd config is not what 10-lab.conf asks for:
          {{ sshd_effective.stdout_lines
             | select('match', '^(passwordauthentication|permitrootlogin) ')
             | join(', ') }}
      tags: [base]

    - name: Check that the login account has a usable password
      ansible.builtin.command: passwd -S robertcowher
      become: true
      register: rc_passwd
      changed_when: false
      tags: [base]

    # PasswordAuthentication yes on an account with a locked or absent password
    # is a config that looks enabled and refuses every login. The flag and the
    # account have to agree, so check both.
    - name: The login account can actually be used with a password
      ansible.builtin.assert:
        that:
          - rc_passwd.stdout.split()[1] == 'P'
        fail_msg: >-
          robertcowher's password status is
          "{{ rc_passwd.stdout.split()[1] }}" (P = usable, L = locked,
          NP = none). sshd accepts passwords but this account cannot use one.
      tags: [base]

    - name: Collect volume group free space
      ansible.builtin.command: vgs --noheadings -o vg_free --units b --nosuffix ubuntu-vg
      become: true
      register: vg_free
      changed_when: false
      tags: [storage]

    - name: Volume group has been fully allocated
      ansible.builtin.assert:
        that:
          - vg_free.stdout | trim | int < 33554432
        fail_msg: >-
          ubuntu-vg still has {{ vg_free.stdout | trim | int // 1073741824 }}GB
          unallocated; the root LV was not extended.
      tags: [storage]

    - name: Root filesystem is larger than the installer default
      ansible.builtin.assert:
        that:
          - (ansible_mounts | selectattr('mount', 'eq', '/') | first).size_total
            > 214748364800
        fail_msg: Root filesystem is still at or below the 100GB install default.
      tags: [storage]

    - name: Collect /data directory state
      ansible.builtin.stat:
        path: "{{ item }}"
      register: data_dirs
      loop:
        - "{{ data_root }}"
        - "{{ data_root }}/models"
        - "{{ data_root }}/datasets"
        - "{{ data_root }}/beekeeper"
      tags: [storage]

    - name: Data directories exist, are group ml, and are setgid
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.gid | int == ml_gid
          - item.stat.mode == '2775'
        fail_msg: >-
          {{ item.item }} is mode {{ item.stat.mode | default('absent') }}
          gid {{ item.stat.gid | default('n/a') }}; expected mode 2775 gid
          {{ ml_gid }}. Without setgid the shared tree rots as soon as two
          users write to it.
      loop: "{{ data_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: [storage]

    - name: nvidia-smi runs on the host
      ansible.builtin.command: nvidia-smi --query-gpu=name,pci.bus_id --format=csv,noheader
      register: smi
      changed_when: false
      tags: [nvidia]

    - name: Both GPUs are visible
      ansible.builtin.assert:
        that:
          - smi.stdout_lines | length == 2
          - "'3090' in smi.stdout"
          - "'3060' in smi.stdout"
        fail_msg: "Expected an RTX 3090 and an RTX 3060, got: {{ smi.stdout }}"
      tags: [nvidia]

    - name: Container toolkit is installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' nvidia-container-toolkit
      register: nct
      changed_when: false
      failed_when: "'ok installed' not in nct.stdout"
      tags: [nvidia]

    - name: Read apt holds
      ansible.builtin.command: apt-mark showhold
      register: holds
      changed_when: false
      tags: [nvidia, docker]

    - name: NVIDIA packages are pinned against unattended upgrades
      ansible.builtin.assert:
        that:
          - holds.stdout is search('nvidia')
        fail_msg: >-
          No nvidia package is held. An automatic driver upgrade desyncs the
          userspace libraries from the loaded kernel module and breaks every
          GPU container without warning (spec 3.6).
      tags: [nvidia]

    - name: Docker daemon state
      ansible.builtin.systemd_service:
        name: docker
      become: true
      register: dockersvc
      changed_when: false
      tags: [docker]

    - name: Docker is running and enabled
      ansible.builtin.assert:
        that:
          - dockersvc.status.ActiveState == 'active'
          - dockersvc.status.UnitFileState == 'enabled'
        fail_msg: "Docker is {{ dockersvc.status.ActiveState }}"
      tags: [docker]

    - name: Compose plugin is present
      ansible.builtin.command: docker compose version
      become: true
      register: composev
      changed_when: false
      tags: [docker]

    - name: GPUs are visible inside a container
      ansible.builtin.command: >-
        docker run --rm --gpus all
        nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi -L
      become: true
      register: cuda_smi
      changed_when: false
      tags: [docker]

    - name: Both GPUs are passed through to containers
      ansible.builtin.assert:
        that:
          - cuda_smi.stdout_lines | select('match', '^GPU') | list | length == 2
        fail_msg: >-
          Container sees {{ cuda_smi.stdout_lines | length }} GPU line(s).
          "Package installed" is not proof of a working toolkit; this is.
      tags: [docker]

    - name: Read the docker group
      ansible.builtin.getent:
        database: group
        key: docker
      tags: [docker]

    - name: robertcowher and llm can reach the docker socket
      ansible.builtin.assert:
        that:
          - "'robertcowher' in getent_group['docker'][2]"
          - "'llm' in getent_group['docker'][2]"
        fail_msg: >-
          docker group members are {{ getent_group['docker'][2] }};
          llama-swap runs as llm and spawns backend containers.
      tags: [docker]

    - name: Docker packages are held
      ansible.builtin.assert:
        that:
          - holds.stdout is search('docker-ce')
          - holds.stdout is search('containerd')
        fail_msg: "docker/containerd not held: {{ holds.stdout }}"
      tags: [docker]

    - name: Read ufw status
      ansible.builtin.command: ufw status verbose
      become: true
      register: ufwst
      changed_when: false
      tags: [firewall]

    - name: ufw denies by default and allows only the native LAN services
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufwst.stdout"
          - "'deny (incoming)' in ufwst.stdout"
          - ufwst.stdout is search('22')
          - ufwst.stdout is search('8080')
          - ufwst.stdout is search('5000')
          # The per-run TensorBoard range. Asserted as the range ufw actually
          # prints, not just '6006', so a rule that opened a single port would
          # fail here rather than pass and then strand the second run.
          - ufwst.stdout is search(tensorboard_port_range | regex_escape)
        fail_msg: "ufw is not in the expected state:\n{{ ufwst.stdout }}"
      tags: [firewall]

    - name: Read the DOCKER-USER chain
      ansible.builtin.command: iptables -S DOCKER-USER
      become: true
      register: duser
      changed_when: false
      tags: [firewall]

    - name: Container traffic is filtered, with return traffic preserved
      ansible.builtin.assert:
        that:
          - duser.stdout is search('RELATED,ESTABLISHED')
          - duser.stdout is search('dport 80')
          - duser.stdout is search('-i ' ~ wan_interface ~ ' -j DROP')
        fail_msg: >-
          DOCKER-USER does not enforce the container policy:
          {{ duser.stdout }}
      tags: [firewall]

    # This looks fussy but it checks a failure that presents as "containers
    # mysteriously cannot reach the internet" and is hard to diagnose after
    # the fact: DOCKER-USER sits in FORWARD, which also carries return
    # traffic for outbound container connections.
    - name: The conntrack RETURN precedes the DROP
      ansible.builtin.assert:
        that:
          - >-
            (duser.stdout_lines | select('search', 'RELATED,ESTABLISHED')
             | list | length) > 0
          - >-
            duser.stdout_lines.index(
              duser.stdout_lines | select('search', 'RELATED,ESTABLISHED') | first
            ) < duser.stdout_lines.index(
              duser.stdout_lines | select('search', '-j DROP') | first
            )
        fail_msg: >-
          The DROP rule precedes the conntrack RETURN. Containers will lose
          outbound networking with no error message.
      tags: [firewall]

    - name: The DOCKER-USER rules unit is enabled
      ansible.builtin.systemd_service:
        name: docker-user-rules
      become: true
      register: dursvc
      changed_when: false
      tags: [firewall]

    - name: Rules survive a docker restart because they are a unit
      ansible.builtin.assert:
        that:
          - dursvc.status.UnitFileState == 'enabled'
        fail_msg: >-
          docker-user-rules is {{ dursvc.status.UnitFileState }}. Docker
          recreates the DOCKER-USER chain on daemon restart, so these rules
          must be reapplied by a unit rather than set once.
      tags: [firewall]

    - name: Every declared environment exists at its pinned Python version
      ansible.builtin.command: "{{ conda_prefix }}/envs/{{ item.name }}/bin/python --version"
      register: envpy
      changed_when: false
      failed_when: item.python not in envpy.stdout
      loop: "{{ conda_envs }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [conda]

    - name: Conda is initialised for login shells
      ansible.builtin.stat:
        path: /etc/profile.d/conda.sh
      register: condaprofile
      tags: [conda]

    - name: Profile init exists rather than per-user bashrc edits
      ansible.builtin.assert:
        that:
          - condaprofile.stat.exists
        fail_msg: /etc/profile.d/conda.sh missing
      tags: [conda]

    - name: Inspect the conda prefix
      ansible.builtin.stat:
        path: "{{ conda_prefix }}"
      register: condaprefix
      tags: [conda]

    - name: The shared prefix is group ml and NOT group-writable
      ansible.builtin.assert:
        that:
          - condaprefix.stat.gid | int == ml_gid
          - condaprefix.stat.mode == '0755'
        fail_msg: >-
          {{ conda_prefix }} is mode {{ condaprefix.stat.mode }} gid
          {{ condaprefix.stat.gid }}. A group-writable prefix lets any ml
          member mutate the environment a running service depends on
          (spec 5.7).
      tags: [conda]

    - name: conda resolves in a login shell
      ansible.builtin.shell: bash -lc 'conda --version'
      register: condalogin
      changed_when: false
      tags: [conda]

    - name: base is not auto-activated
      ansible.builtin.shell: bash -lc 'echo "${CONDA_DEFAULT_ENV:-none}"'
      register: condabase
      changed_when: false
      tags: [conda]

    - name: A base env is not silently prepended to every shell PATH
      ansible.builtin.assert:
        that:
          - condabase.stdout | trim == 'none'
        fail_msg: >-
          base is auto-activated ({{ condabase.stdout | trim }}). That is how
          the wrong python ends up running a service.
      tags: [conda]

    - name: robertcowher has a writable envs directory
      ansible.builtin.shell: bash -lc 'conda config --show envs_dirs'
      become: true
      become_user: robertcowher
      register: envdirs
      changed_when: false
      tags: [conda]

    - name: Personal environments resolve to a writable path
      ansible.builtin.assert:
        that:
          - envdirs.stdout is search('/home/robertcowher/.conda/envs')
        fail_msg: >-
          envs_dirs is {{ envdirs.stdout }}. The shared prefix is read-only by
          design, so conda must fall back to ~/.conda/envs for personal
          environments.
      tags: [conda]

    - name: Apt tools are installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' {{ item }}
      register: tool_pkg
      changed_when: false
      failed_when: "'ok installed' not in tool_pkg.stdout"
      loop: "{{ tools_apt }}"
      tags: [tools]

    - name: nvitop runs and can read the GPUs
      ansible.builtin.command: /usr/local/bin/nvitop -1
      become: true
      register: nvitop_out
      changed_when: false
      tags: [tools]

    - name: nvitop exercised the driver, NVML, and the Python bindings
      ansible.builtin.assert:
        that:
          - nvitop_out.rc == 0
        fail_msg: "nvitop failed: {{ nvitop_out.stderr | default('') }}"
      tags: [tools]

    # --- memory diagnostics ---------------------------------------------
    - name: Collect sensor readings
      ansible.builtin.command: sensors -u
      register: sensors_out
      changed_when: false
      tags: [tools]

    # `sensors` exits 0 whenever it finds any chip at all, so rc alone is a
    # false green: if asus_ec_sensors stops matching this board after a kernel
    # upgrade, sensors still succeeds and still prints k10temp and the NVMe,
    # just with every motherboard reading silently gone. Assert on the chip
    # that is actually hard to get, not on the exit status.
    - name: The ASUS EC sensors are present, not just the CPU and NVMe
      ansible.builtin.assert:
        that:
          - sensors_out.rc == 0
          - "'asusec-' in sensors_out.stdout"
          - "'temp5_input' in sensors_out.stdout"
        fail_msg: >-
          asus_ec_sensors is not reporting. Chips found:
          {{ sensors_out.stdout_lines
             | reject('match', '^( |$)') | join(', ') | default('none') }}.
          Motherboard, chipset and VRM temperatures are unavailable until the
          driver matches again -- check `dmesg | grep asus-ec-sensors`.
      tags: [tools]

    - name: Check that RAS event recording is running
      ansible.builtin.command: systemctl is-active rasdaemon
      register: rasd_active
      changed_when: false
      failed_when: false
      tags: [tools]

    - name: Read the recorded RAS error history
      ansible.builtin.command: ras-mc-ctl --errors
      become: true
      register: ras_errors
      changed_when: false
      failed_when: false
      tags: [tools]

    # Two separate failures matter and only one is obvious. The daemon being
    # dead is obvious. The subtle one is the daemon running with recording off:
    # `ras-mc-ctl --errors` then reports nothing forever, which reads exactly
    # like a clean machine. So this asserts the query works and produced the
    # per-table output it only emits when a DB exists, rather than treating
    # empty output as good news.
    - name: RAS recording is active and its database is readable
      ansible.builtin.assert:
        that:
          - rasd_active.stdout == 'active'
          - ras_errors.rc == 0
          - ras_errors.stdout | length > 0
        fail_msg: >-
          rasdaemon is "{{ rasd_active.stdout }}" and `ras-mc-ctl --errors`
          exited {{ ras_errors.rc }} with
          {{ ras_errors.stdout | length }} bytes. Without this there is no
          record of a machine check surviving the nightly poweroff.
      tags: [tools]

    # --- bobgpt ---------------------------------------------------------------
    #
    # This host is provisioned for a server whose code lives in
    # github.com/bobcowher/bobgptv1. These assertions cover the host contract
    # only; whether the server works is that repository's business.

    - name: Read the bobgpt unit state
      ansible.builtin.command: systemctl is-enabled bobgpt.service
      register: bobgpt_enabled_state
      changed_when: false
      failed_when: false
      tags: [bobgpt]

    - name: Read whether bobgpt is running
      ansible.builtin.command: systemctl is-active bobgpt.service
      register: bobgpt_active_state
      changed_when: false
      failed_when: false
      tags: [bobgpt]

    # Not enabled, deliberately: a GPU service on a box whose GPUs exist for
    # training is started by hand. Asserted together with the inverse -- that
    # a not-enabled unit is also not running at the END of a play -- because
    # this repo has twice shipped a check that passed while a handler had
    # quietly re-armed the thing it was meant to guard. A manual start is
    # fine; a start that Ansible caused is the bug this catches.
    - name: bobgpt does not start at boot, and the play did not start it
      ansible.builtin.assert:
        that:
          - bobgpt_enabled_state.stdout == 'disabled'
          - bobgpt_active_state.stdout != 'activating'
        fail_msg: >-
          bobgpt.service is enabled="{{ bobgpt_enabled_state.stdout }}"
          active="{{ bobgpt_active_state.stdout }}". It must stay disabled and
          must never be started by a playbook run.
      tags: [bobgpt]

    - name: Read the bobgpt host facts file
      ansible.builtin.slurp:
        src: /etc/bobgpt/host.env
      register: bobgpt_env
      tags: [bobgpt]

    # The facts file is the whole interface between this repo and that one, so
    # the values the repository reads are asserted to be the values this repo
    # believes it published.
    - name: The host facts file publishes the contract
      ansible.builtin.assert:
        that:
          - "'BOBGPT_CHECKPOINT_ROOT=' ~ bobgpt_checkpoint_root in bobgpt_env_text"
          - "'BOBGPT_PORT=' ~ bobgpt_port in bobgpt_env_text"
          - "'BOBGPT_HOST=' ~ bobgpt_host in bobgpt_env_text"
          - "'BOBGPT_PYTHON=' ~ bobgpt_python in bobgpt_env_text"
          - "'BOBGPT_SRC=' ~ bobgpt_root ~ '/src' in bobgpt_env_text"
        fail_msg: >-
          /etc/bobgpt/host.env does not match the variables in vars.yml.
      vars:
        bobgpt_env_text: "{{ bobgpt_env.content | b64decode }}"
      tags: [bobgpt]

    # One command emitting tokens, rather than two tasks whose rc is the
    # answer. The first attempt here used `runuser`, which needs root that
    # this play does not have, so BOTH probes failed -- and the
    # "cannot write" half passed because the command errored, not because
    # write was denied. A broken invocation must not be able to look like a
    # pass, so the assertion requires the tokens to be present.
    - name: Probe the service user's access to the checkpoints
      ansible.builtin.command: >-
        sudo -n -u {{ bobgpt_user }} /bin/sh -c
        "test -r {{ bobgpt_checkpoint_root }} && echo READ=yes || echo READ=no"
      register: bobgpt_ckpt
      changed_when: false
      tags: [bobgpt]

    - name: The service user can read the checkpoints
      ansible.builtin.assert:
        that:
          - "'READ=yes' in bobgpt_ckpt.stdout"
        fail_msg: >-
          {{ bobgpt_user }} cannot read {{ bobgpt_checkpoint_root }}
          (probe said: "{{ bobgpt_ckpt.stdout | trim }}"). It is a member of
          group ml, which is how this box shares the dataset tree.
      tags: [bobgpt]

    - name: Read the live sandbox settings off the unit
      ansible.builtin.command: >-
        systemctl show bobgpt.service -p ProtectSystem -p ReadWritePaths
      register: bobgpt_sandbox
      changed_when: false
      tags: [bobgpt]

    # This is the assertion that actually protects the checkpoints, and it is
    # worth being precise about why.
    #
    # POSIX does NOT protect them. The tree is group ml with group write
    # (drwxrwsr-x), which is deliberate -- it is how beekeeper writes runs and
    # how robertcowher shares them -- and bobgpt is in ml so it can read the
    # weights. Verified on 2026-10-04: the service user can create a file in
    # the checkpoint directory.
    #
    # ProtectSystem=strict is what denies it, by making the whole filesystem
    # read-only except ReadWritePaths. Also verified, with systemd-run using
    # these exact settings: the write failed with "Read-only file system"
    # while the cache stayed writable and the weights stayed readable.
    #
    # So the unit's sandbox is load-bearing, not decoration, and the
    # checkpoint root must never appear in ReadWritePaths. A web service one
    # bug away from truncating a training run's checkpoint is not a trade
    # worth making.
    - name: The sandbox makes the checkpoints read-only to the service
      ansible.builtin.assert:
        that:
          - "'ProtectSystem=strict' in bobgpt_sandbox.stdout"
          - bobgpt_checkpoint_root not in bobgpt_sandbox.stdout
          - "'/data' not in (bobgpt_sandbox.stdout | regex_search('ReadWritePaths=.*') | default('', true))"
        fail_msg: >-
          bobgpt.service's sandbox does not protect the checkpoints.
          systemctl reports: {{ bobgpt_sandbox.stdout_lines | join(' | ') }}.
          ProtectSystem must be strict and ReadWritePaths must not reach
          {{ bobgpt_checkpoint_root }} -- POSIX permits the write, so this is
          the only thing stopping it.
      tags: [bobgpt]

    - name: Read the persisted Open WebUI upstreams
      ansible.builtin.command: >-
        python3 -c "import sqlite3,json;
        print(json.load(open('/dev/stdin')) if False else
        sqlite3.connect('{{ data_root }}/open-webui/webui.db').execute(
        \"select value from config where key='openai.api_base_urls'\").fetchone()[0])"
      register: owui_upstreams
      changed_when: false
      tags: [bobgpt, webstack]

    # The compose env var is NOT the source of truth for this -- it is
    # PersistentConfig, so webui.db wins from the second start onward. Reading
    # the database is the only assertion that proves the dropdown will actually
    # offer bobgpt.
    - name: Open WebUI's persisted upstreams include bobgpt
      ansible.builtin.assert:
        that:
          - "':' ~ bobgpt_port ~ '/v1' in owui_upstreams.stdout"
          - "':8080/v1' in owui_upstreams.stdout"
        fail_msg: >-
          Open WebUI's persisted openai.api_base_urls is
          {{ owui_upstreams.stdout }}, which does not contain both llama-swap
          on 8080 and bobgpt on {{ bobgpt_port }}.
      tags: [bobgpt, webstack]

    - name: Read the ufw rules for the bobgpt port
      ansible.builtin.command: ufw status
      register: bobgpt_ufw
      changed_when: false
      become: true
      tags: [bobgpt, firewall]

    # The Docker rule is the one that matters here, and it is the one that
    # looks redundant.
    #
    # bobgpt is reachable from the LAN (Robert curls it from the desktop while
    # iterating), so it would be easy to conclude the 172.16.0.0/12 rule is
    # covered by the 192.168.1.0/24 one and delete it. It is not: Open WebUI
    # is a container, it reaches host services through the Docker bridge
    # gateway, and that traffic arrives with a bridge source address that
    # lan_subnet does not match. Removing it breaks the model dropdown while
    # every hand test from the desktop still passes.
    #
    # Verified by experiment on 2026-10-04: before this rule existed, a
    # request from inside the open-webui container timed out no matter what
    # the service bound to.
    #
    # The loopback check belongs with it for the same reason -- a 127.0.0.1
    # bind is unreachable from the container even with both rules present.
    - name: bobgpt's port is reachable from containers, not only the LAN
      ansible.builtin.assert:
        that:
          - bobgpt_port | string ~ '/tcp' in bobgpt_ufw.stdout
          - docker_bridge_subnet in bobgpt_port_rules
          - bobgpt_host != '127.0.0.1'
        fail_msg: >-
          bobgpt's port {{ bobgpt_port }} is not reachable from containers.
          ufw rules mentioning it: {{ bobgpt_port_rules | default('none') }};
          bind address is {{ bobgpt_host }}. It must be allowed from
          {{ docker_bridge_subnet }} and must not bind loopback, or Open WebUI
          cannot reach it -- regardless of any {{ lan_subnet }} rule.
      vars:
        bobgpt_port_rules: >-
          {{ bobgpt_ufw.stdout_lines
             | select('search', bobgpt_port | string ~ '/tcp')
             | join(' ') }}
      tags: [bobgpt, firewall]

    - name: Check for the repo-owned entrypoint
      ansible.builtin.stat:
        path: "{{ bobgpt_root }}/src/serve.sh"
      register: bobgpt_entrypoint
      tags: [bobgpt]

    # A warning, not a failure. The entrypoint belongs to bobgptv1, and this
    # host is correctly provisioned whether or not that repository has caught
    # up. Without this the only symptom is systemd's status=203/EXEC, which
    # names nothing useful.
    - name: Warn if the repository has not supplied serve.sh yet
      ansible.builtin.debug:
        msg: >-
          {{ bobgpt_root }}/src/serve.sh is missing or not executable, so
          `sudo systemctl start bobgpt` will fail with status=203/EXEC. The
          host is ready. bobgptv1 needs to provide an executable serve.sh that
          listens on $BOBGPT_HOST:$BOBGPT_PORT; the facts it can read are in
          /etc/bobgpt/host.env.
      when: not (bobgpt_entrypoint.stat.exists
                 and bobgpt_entrypoint.stat.executable | default(false))
      tags: [bobgpt]

    - name: Claude Code is installed for robertcowher
      ansible.builtin.command: /home/robertcowher/.local/bin/claude --version
      become: true
      become_user: robertcowher
      register: claude_v
      changed_when: false
      tags: [tools]

    - name: Claude Code reports a version
      ansible.builtin.assert:
        that:
          - claude_v.rc == 0
        fail_msg: "claude --version failed: {{ claude_v.stderr | default('') }}"
      tags: [tools]

    # ssh hands lab whatever TERM the workstation exports. Ubuntu ships the
    # ghostty entry as `ghostty` with no `xterm-ghostty` alias, which is why
    # tmux refused to start. Note what this does NOT assert: `tmux new-session
    # -d` returns 0 on a host with no entry at all -- it only fails on attach,
    # which needs a tty -- so a tmux-based check would have passed throughout
    # the outage. Resolving the terminfo name is the thing that was broken.
    - name: The ghostty terminfo entry resolves
      ansible.builtin.command: infocmp -x -1 xterm-ghostty
      register: ghostty_ti
      changed_when: false
      failed_when: false
      tags: [tools]

    - name: Interactive sessions from ghostty have a usable terminal
      ansible.builtin.assert:
        that:
          - ghostty_ti.rc == 0
          - "'colors#0x100' in ghostty_ti.stdout or 'colors#256' in ghostty_ti.stdout"
          - "'Tc' in ghostty_ti.stdout"
        fail_msg: >-
          TERM=xterm-ghostty does not resolve on lab (rc={{ ghostty_ti.rc }}).
          tmux will abort with "missing or unsuitable terminal" for anyone
          connecting from Ghostty.
      tags: [tools]

    - name: The compiled entry lives in /etc/terminfo
      ansible.builtin.stat:
        path: /etc/terminfo/x/xterm-ghostty
      register: ghostty_ti_file
      tags: [tools]

    # /usr/share/terminfo is dpkg-owned: an entry compiled there survives until
    # the next ncurses upgrade and then vanishes. Asserting the path, not just
    # that the name resolves, is what keeps this from silently regressing.
    - name: The terminfo entry is somewhere an ncurses upgrade will not erase
      ansible.builtin.assert:
        that:
          - ghostty_ti_file.stat.exists
        fail_msg: >-
          xterm-ghostty resolves but /etc/terminfo/x/xterm-ghostty is missing,
          so it is being served from a package-owned directory and will
          disappear on the next ncurses upgrade.
      tags: [tools]

    - name: llama-swap service state
      ansible.builtin.systemd_service:
        name: llama-swap
      become: true
      register: lsvc
      changed_when: false
      tags: [llama_swap]

    - name: llama-swap is active and enabled
      ansible.builtin.assert:
        that:
          - lsvc.status.ActiveState == 'active'
          - lsvc.status.UnitFileState == 'enabled'
        fail_msg: "llama-swap is {{ lsvc.status.ActiveState }}"
      tags: [llama_swap]

    - name: llama-swap answers over the LAN address
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8080/"
        status_code: [200, 302, 404]
      tags: [llama_swap]

    - name: Read the unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/llama-swap.service
      become: true
      register: lsunit
      tags: [llama_swap]

    - name: Device ordering is pinned and the service runs as llm
      ansible.builtin.assert:
        that:
          - "'CUDA_DEVICE_ORDER=PCI_BUS_ID' in (lsunit.content | b64decode)"
          - "'User=llm' in (lsunit.content | b64decode)"
        fail_msg: >-
          The 3060 sorts first by PCI bus ID, so without an explicit
          CUDA_DEVICE_ORDER "GPU 0" is the smaller card (spec 3.5).
      tags: [llama_swap]

    - name: The installed config is valid
      ansible.builtin.command: >-
        /usr/local/bin/llama-swap -config /etc/llama-swap/config.yaml -validate
      register: lsvalid
      changed_when: false
      tags: [llama_swap]

    - name: Compose unit state
      ansible.builtin.systemd_service:
        name: docker-compose@webstack
      become: true
      register: wsvc
      changed_when: false
      tags: [webstack]

    - name: The webstack compose project is active and enabled
      ansible.builtin.assert:
        that:
          - wsvc.status.ActiveState == 'active'
          - wsvc.status.UnitFileState == 'enabled'
        fail_msg: "docker-compose@webstack is {{ wsvc.status.ActiveState }}"
      tags: [webstack]

    - name: Caddy serves Open WebUI at the root
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        status_code: [200, 302, 401]
        follow_redirects: none
      # Open WebUI takes tens of seconds to become ready, so when a handler has
      # just restarted the stack this races and Caddy answers 502. Retrying is
      # the assertion working, not a weakened one -- it still fails if the app
      # never comes back.
      register: webui_root
      retries: 20
      delay: 5
      until: webui_root.status in [200, 302, 401]
      tags: [webstack]

    - name: Caddy serves File Browser under /files
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/files/"
        status_code: [200, 302, 401]
        follow_redirects: none
      tags: [webstack]

    - name: /beekeeper/ redirects rather than proxying
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/beekeeper/"
        status_code: [301, 302]
        follow_redirects: none
      register: bkredir
      tags: [webstack]

    - name: The beekeeper redirect points at port 5000
      ansible.builtin.assert:
        that:
          - "':5000' in bkredir.location"
        fail_msg: >-
          /beekeeper must redirect to :5000, not proxy. Beekeeper has no
          subpath support and its escaped paths would silently match Open
          WebUI's routes (spec 3.2).
      tags: [webstack]

    - name: Enumerate listening TCP sockets
      ansible.builtin.command: ss -ltnH
      become: true
      register: sockets
      changed_when: false
      tags: [webstack]

    - name: No containerized service listens on a LAN address
      ansible.builtin.assert:
        that:
          - sockets.stdout is not search('0.0.0.0:3000')
          - sockets.stdout is not search('0.0.0.0:8081')
          - sockets.stdout is not search('0.0.0.0:9100')
          - sockets.stdout is not search('0.0.0.0:9400')
          - >-
            sockets.stdout is not
            search(ansible_default_ipv4.address | regex_escape ~ ':3000')
        fail_msg: >-
          A containerized service is bound to a LAN address. ufw cannot filter
          Docker published ports, so this is reachable from the LAN despite
          default-deny (spec 3.1).
      tags: [webstack]

    - name: All webstack containers are running and none are unhealthy
      ansible.builtin.command: >-
        docker ps --filter label=com.docker.compose.project=webstack
        --format {{ '{{.Names}}:{{.Status}}' }}
      become: true
      register: wcontainers
      changed_when: false
      tags: [webstack]

    - name: Six containers up, no unhealthy ones
      ansible.builtin.assert:
        that:
          # caddy, open-webui, filebrowser, dcgm-exporter, node-exporter, searxng
          - wcontainers.stdout_lines | length == 6
          - wcontainers.stdout is not search('unhealthy')
        fail_msg: "webstack containers: {{ wcontainers.stdout }}"
      tags: [webstack]

    - name: beekeeper service state
      ansible.builtin.systemd_service:
        name: beekeeper
      become: true
      register: bksvc
      changed_when: false
      tags: [beekeeper]

    - name: beekeeper is active and enabled
      ansible.builtin.assert:
        that:
          - bksvc.status.ActiveState == 'active'
          - bksvc.status.UnitFileState == 'enabled'
        fail_msg: "beekeeper is {{ bksvc.status.ActiveState }}"
      tags: [beekeeper]

    - name: The API answers on the port its consumers expect
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:5000/api/v1/busy"
        return_content: true
      register: busy
      tags: [beekeeper]

    - name: The busy endpoint returns valid JSON
      ansible.builtin.assert:
        that:
          - busy.json is defined
        fail_msg: >-
          /api/v1/busy did not return JSON. deploy.sh polls this endpoint
          before restarting, and the MCP config and generated agent SDKs both
          bake in this address (spec 3.2).
      tags: [beekeeper]

    - name: The service venv uses the conda 3.12 interpreter
      ansible.builtin.command: "{{ beekeeper_home }}/venv/bin/python --version"
      become: true
      become_user: beekeeper
      register: bkpy
      changed_when: false
      tags: [beekeeper]

    - name: beekeeper is not running on Python 3.13 or newer
      ansible.builtin.assert:
        that:
          - "'3.12' in bkpy.stdout"
        fail_msg: >-
          venv reports {{ bkpy.stdout }}. numpy<2.0 has no wheels above 3.12.
      tags: [beekeeper]

    - name: The sudoers drop-in parses
      ansible.builtin.command: /usr/sbin/visudo -cf /etc/sudoers.d/beekeeper
      become: true
      register: bksudo
      changed_when: false
      tags: [beekeeper]

    - name: Read the effective wait-online configuration
      ansible.builtin.command: systemctl cat systemd-networkd-wait-online.service
      become: true
      register: waitonline
      changed_when: false
      tags: [base]

    - name: Read the interface holding the default route
      ansible.builtin.command: ip -o route show default
      register: defroute
      changed_when: false
      tags: [base]

    # wan_interface is the single name behind both the wait-online scoping and
    # the DOCKER-USER DROP rule, and nothing else in the repo notices when it
    # stops matching the cable. Every assertion downstream of it is phrased as
    # "the rule mentions {{ wan_interface }}", which stays true when the
    # variable names an empty port -- so the wait-online check passes while the
    # unit times out for 30s on every boot, and the firewall check passes while
    # the DROP rule filters an interface with no traffic on it. This is the only
    # assertion that compares the variable against the machine.
    - name: wan_interface names the port that actually carries traffic
      ansible.builtin.assert:
        that:
          - defroute.stdout_lines | length > 0
          - defroute.stdout_lines[0].split('dev ')[1].split()[0] == wan_interface
        fail_msg: >-
          wan_interface is "{{ wan_interface }}" but the default route is on
          "{{ defroute.stdout_lines[0].split('dev ')[1].split()[0]
              if defroute.stdout_lines | length > 0 else 'no default route' }}".
          Both the wait-online drop-in and the DOCKER-USER DROP rule are scoped
          to wan_interface, so while these disagree the boot burns its
          wait-online timeout and the DROP rule guards a port with no cable in
          it. Move the cable, or set wan_interface to the live port -- and see
          "The box stops dead under load" in docs/RUNBOOK.md first, because
          which port carries traffic is not an arbitrary choice here.
      tags: [base]

    - name: Boot waits only for the primary link
      ansible.builtin.assert:
        that:
          - >-
            waitonline.stdout_lines
            | select('search', '^ExecStart=.*wait-online')
            | list | last is search('--any')
          - >-
            waitonline.stdout_lines
            | select('search', '^ExecStart=.*wait-online')
            | list | last is search('-i ' ~ wan_interface)
        fail_msg: >-
          The last effective ExecStart does not scope wait-online to
          {{ wan_interface }} with --any. An empty second NIC sits at
          no-carrier forever, so the unit burns its full timeout, delaying
          systemd-user-sessions and leaving /run/nologin in place -- SSH
          answers but refuses every non-root login for two minutes.
      tags: [base]

    - name: No stale nologin lock is present
      ansible.builtin.stat:
        path: /run/nologin
      register: nologin
      tags: [base]

    - name: Logins are permitted
      ansible.builtin.assert:
        that:
          - not nologin.stat.exists
        fail_msg: >-
          /run/nologin exists, so unprivileged SSH logins are refused. Boot
          did not finish cleanly, or a shutdown is pending.
      tags: [base]

    - name: The backend image is present
      ansible.builtin.command: "docker image inspect {{ llama_cpp_image }}"
      become: true
      register: backend_img
      changed_when: false
      tags: [llama_swap]

    - name: llama-swap advertises every declared model
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8080/v1/models"
        return_content: true
      register: adv
      tags: [llama_swap]

    - name: Every model in vars is served, and none hold VRAM at rest
      ansible.builtin.assert:
        that:
          - >-
            (adv.json.data | map(attribute='id') | sort)
            == (llama_models | map(attribute='name') | sort)
        fail_msg: >-
          llama-swap serves {{ adv.json.data | map(attribute='id') | list }},
          expected {{ llama_models | map(attribute='name') | list }}.
      tags: [llama_swap]

    - name: Models declare an eviction TTL
      ansible.builtin.assert:
        that:
          - item.ttl | default(llama_swap_ttl_default) | int > 0
            or item.gpus | default('') == 'device=0'
        fail_msg: >-
          {{ item.name }} has no TTL and is not pinned to the 3060. This box is
          primarily for RL: the 3090 must never be held indefinitely. A model
          that should stay resident has to live on the 3060 (gpus: device=0),
          which leaves the big card free for training.
      loop: "{{ llama_models }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]

    - name: Every model states its GPU placement explicitly
      ansible.builtin.assert:
        that:
          - item.gpus is defined
          - item.gpus in ['all', 'device=0', 'device=1']
        fail_msg: >-
          {{ item.name }} does not set a valid `gpus`. Use 'all' (both cards),
          'device=0' (3060) or 'device=1' (3090) -- docker indexes by PCI bus
          order, so device=0 is the SMALLER card. An unset value would let a
          model land on the 12GB card by default.
      loop: "{{ llama_models }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]

    - name: No model overrides llama.cpp's memory autotuner
      ansible.builtin.assert:
        that:
          - item.tensor_split is not defined
          - item.ngl is not defined
        fail_msg: >-
          {{ item.name }} sets tensor_split or ngl. Both disable llama.cpp's
          --fit, which is what lets a model size itself to whatever VRAM is
          actually free. `-ngl 99` aborts it outright: "n_gpu_layers already
          set by user to 99, abort". Together they are what made a big model
          OOM against the always-on 3060 model. --fit also measured FASTER
          than a hand-tuned split. Leave both unset.
      loop: "{{ llama_models }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]

    - name: Exactly one lane may be resident, and only on the small card
      ansible.builtin.assert:
        that:
          - item.gpus == 'device=0'
        fail_msg: >-
          {{ item.name }} is in the resident group but is not pinned to the
          3060. A never-evicted model on the 3090 would permanently deny the
          training card.
      loop: "{{ llama_models | selectattr('group', 'defined') | selectattr('group', 'eq', 'resident') | list }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]


    - name: Read the idle-suspend timer state
      ansible.builtin.command: >-
        systemctl show lab-idle-shutdown.timer
        -p LoadState -p ActiveState -p UnitFileState -p Persistent
      register: pw_timer
      changed_when: false
      become: true
      tags: [power]

    - name: The overnight idle check is armed
      ansible.builtin.assert:
        that:
          - "'LoadState=loaded' in pw_timer.stdout"
          - "'ActiveState=active' in pw_timer.stdout"
          - "'UnitFileState=enabled' in pw_timer.stdout"
        fail_msg: >-
          lab-idle-shutdown.timer is not loaded, enabled and active:
          {{ pw_timer.stdout }}
      when: power_shutdown_enabled | bool
      tags: [power]

    # The inverse assertion, and it exists because its absence hid a live bug:
    # with the feature disabled the check above simply skipped, so a timer left
    # ACTIVE by a handler that ran after the stop task passed verification
    # while armed to power the box off at midnight. "Disabled" has to be
    # asserted as positively as "enabled".
    - name: A disabled idle check is actually stopped
      ansible.builtin.assert:
        that:
          - "'ActiveState=inactive' in pw_timer.stdout"
          - "'UnitFileState=enabled' not in pw_timer.stdout"
        fail_msg: >-
          power_shutdown_enabled is false but lab-idle-shutdown.timer is still
          running: {{ pw_timer.stdout }}. It will power the box off tonight.
      when: not (power_shutdown_enabled | bool)
      tags: [power]

    # Asserted explicitly because Persistent=yes is the one setting that turns
    # this feature against itself: systemd would replay the overnight runs
    # missed while the box was off, so switching it back on would power it
    # straight down again. The default is no, so this catches a hand edit.
    - name: The idle timer does not replay missed runs at boot
      ansible.builtin.assert:
        that:
          - "'Persistent=no' in pw_timer.stdout"
        fail_msg: >-
          lab-idle-shutdown.timer has Persistent set. Switching the box on
          would immediately replay the midnight check and power it off again.
      tags: [power]

    - name: Read the idle-suspend script
      ansible.builtin.stat:
        path: /usr/local/sbin/lab-idle-shutdown
      register: pw_script
      tags: [power]

    - name: The idle-suspend script is installed and executable
      ansible.builtin.assert:
        that:
          - pw_script.stat.exists
          - pw_script.stat.mode == '0755'
        fail_msg: "/usr/local/sbin/lab-idle-shutdown is missing or not executable"
      tags: [power]

    # The strongest check available without actually suspending: runs every
    # signal against the live box and exits 0 only if the whole decision path
    # works. A broken sar invocation or a missing jq fails here rather than at
    # midnight.
    - name: The idle check runs cleanly end to end
      ansible.builtin.command: /usr/local/sbin/lab-idle-shutdown --dry-run
      register: pw_dryrun
      changed_when: false
      become: true
      tags: [power]

    - name: The idle check reached a verdict on every signal
      ansible.builtin.assert:
        that:
          - pw_dryrun.stdout is search('llama-swap inference')
          - pw_dryrun.stdout is search('beekeeper')
          - pw_dryrun.stdout is search('gpu compute processes')
          - pw_dryrun.stdout is search('login sessions')
        fail_msg: "The idle check did not evaluate every signal:\n{{ pw_dryrun.stdout }}"
      tags: [power]

    # sysstat is the only signal with an hour of memory, so its collection
    # timers are asserted structurally. This holds at any uptime, unlike the
    # presence of data below.
    - name: sysstat is actually collecting
      ansible.builtin.command: systemctl is-active sysstat-collect.timer
      register: pw_sysstat
      changed_when: false
      failed_when: pw_sysstat.stdout | trim != 'active'
      tags: [power]

    # Skipped on a freshly booted host. sysstat samples every 10 minutes, so a
    # box up for less than that legitimately has no rows yet and the check
    # correctly refuses to shut down -- asserting otherwise would fail a
    # verify run that happens to follow a reboot.
    - name: The CPU and load history is populated
      ansible.builtin.assert:
        that:
          - pw_dryrun.stdout is not search('NO DATA')
        fail_msg: >-
          No sysstat history despite {{ (ansible_uptime_seconds / 60) | round | int }}
          minutes of uptime. The idle check has lost the only signal that
          remembers more than an instant, and will refuse to shut down.
      when: ansible_uptime_seconds > 1200
      tags: [power]

    # Runs the veto branches an idle box never reaches: the cross-midnight sar
    # read, the threshold comparisons, beekeeper reporting busy, the reboot
    # marker, the override flag. Every case runs a modified COPY of the
    # installed script under --dry-run, so nothing here can power the box off.
    #
    # Wired into verify rather than left as a manual script because the first
    # run of it found a live bug -- sar's "LINUX RESTART" line being counted as
    # data, which defeated the guard that stops the box shutting down on no
    # evidence at all. That class of thing only stays fixed if it runs.
    - name: The idle check's veto branches all fire
      ansible.builtin.script: ../../scripts/test_idle_checks.sh
      register: pw_branches
      changed_when: false
      become: true
      tags: [power]

    - name: Report the veto branch results
      ansible.builtin.debug:
        msg: "{{ pw_branches.stdout_lines | select('search', 'passed|FAIL') | list }}"
      tags: [power]

    - name: Read the unattended-upgrade timer state
      ansible.builtin.command: systemctl show apt-daily-upgrade.timer -p UnitFileState
      register: pw_uu
      changed_when: false
      become: true
      tags: [power]

    # Masked, not merely disabled. Its schedule falls inside the suspend window
    # and its timer is Persistent=yes, so unmasked it would install updates and
    # restart the docker and NVIDIA stacks at the exact moment the box wakes.
    - name: The unattended-upgrade timer cannot fire at boot
      ansible.builtin.assert:
        that:
          - "'UnitFileState=masked' in pw_uu.stdout"
        fail_msg: >-
          apt-daily-upgrade.timer is not masked ({{ pw_uu.stdout }}). It would
          fire in the first minutes after the box is switched on and restart
          services under a running workload.
      tags: [power]

# ansible-playbook exits 0 when a play matches no hosts. For a verification
# playbook that is the worst possible default: a typo in the inventory or the
# host pattern turns every assertion below into a silent pass. This play runs
# on localhost, always, and fails if the lab play did not actually execute.
- name: Guard against a silently empty verify run
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: The lab play must have run
      ansible.builtin.assert:
        that:
          - "'lab' in hostvars"
          - hostvars['lab'].verify_ran | default(false) | bool
        fail_msg: >-
          verify.yml matched no hosts, or the lab play did not run. Nothing was
          verified. Check the inventory path and the host pattern.
      tags: [always]
