---
- name: Verify lab end state
  hosts: lab
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Record that this play actually executed
      ansible.builtin.set_fact:
        verify_ran: true
      tags: [always]

    - name: Host is the expected Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('26.04', '>=')
          - ansible_lsb.codename == 'resolute'
        fail_msg: >-
          Expected Ubuntu 26.04 (resolute), got
          {{ ansible_distribution }} {{ ansible_distribution_version }}
      tags: [always]

    - name: Base packages are installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' {{ item }}
      register: base_pkg
      changed_when: false
      failed_when: "'ok installed' not in base_pkg.stdout"
      loop:
        - build-essential
        - git
        - curl
        - ca-certificates
        - restic
        - unattended-upgrades
      tags: [base]

    - name: Read the unattended-upgrades configuration
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/50unattended-upgrades
      become: true
      register: uu_conf
      tags: [base]

    - name: Unattended-upgrades is scoped to security origins only
      ansible.builtin.assert:
        that:
          - "'${distro_id}:${distro_codename}-security' in (uu_conf.content | b64decode)"
          - "'\"${distro_id}:${distro_codename}\";' not in (uu_conf.content | b64decode)"
        fail_msg: >-
          unattended-upgrades would pull from the full release pocket, which
          moves the NVIDIA driver out from under the container toolkit and
          breaks every GPU container without warning (spec 3.6).
      tags: [base]

    # Ubuntu 26.04 has no /etc/timezone; systemd owns this via the
    # /etc/localtime symlink, so ask timedatectl rather than read a file.
    - name: Read the configured timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: tz_conf
      changed_when: false
      tags: [base]

    - name: Timezone matches the declared value
      ansible.builtin.assert:
        that:
          - tz_conf.stdout | trim == timezone
        fail_msg: "Timezone is {{ tz_conf.stdout | trim }}, expected {{ timezone }}"
      tags: [base]

    - name: Read the ml group
      ansible.builtin.getent:
        database: group
        key: ml
      tags: [users]

    - name: ml group has the exact fleet GID
      ansible.builtin.assert:
        that:
          - getent_group['ml'][1] | int == ml_gid
        fail_msg: >-
          ml GID is {{ getent_group['ml'][1] }}, expected {{ ml_gid }}.
          A drifted GID breaks /data ownership on restore.
      tags: [users]

    - name: Read each managed user
      ansible.builtin.getent:
        database: passwd
        key: "{{ item.name }}"
      register: user_ent
      loop: "{{ lab_users }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [users]

    - name: Each user has the exact fleet UID and expected shell
      ansible.builtin.assert:
        that:
          - item.ansible_facts.getent_passwd[item.item.name][1] | int
            == user_uids[item.item.name]
          - item.ansible_facts.getent_passwd[item.item.name][5]
            == item.item.shell
        fail_msg: >-
          {{ item.item.name }} has UID
          {{ item.ansible_facts.getent_passwd[item.item.name][1] }} /
          shell {{ item.ansible_facts.getent_passwd[item.item.name][5] }},
          expected {{ user_uids[item.item.name] }} / {{ item.item.shell }}
      loop: "{{ user_ent.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      tags: [users]

    - name: The passwordless sudo drop-in parses
      ansible.builtin.command: /usr/sbin/visudo -cf /etc/sudoers.d/robertcowher-nopasswd
      become: true
      register: rc_sudoers
      changed_when: false
      tags: [users]

    - name: Collect volume group free space
      ansible.builtin.command: vgs --noheadings -o vg_free --units b --nosuffix ubuntu-vg
      become: true
      register: vg_free
      changed_when: false
      tags: [storage]

    - name: Volume group has been fully allocated
      ansible.builtin.assert:
        that:
          - vg_free.stdout | trim | int < 33554432
        fail_msg: >-
          ubuntu-vg still has {{ vg_free.stdout | trim | int // 1073741824 }}GB
          unallocated; the root LV was not extended.
      tags: [storage]

    - name: Root filesystem is larger than the installer default
      ansible.builtin.assert:
        that:
          - (ansible_mounts | selectattr('mount', 'eq', '/') | first).size_total
            > 214748364800
        fail_msg: Root filesystem is still at or below the 100GB install default.
      tags: [storage]

    - name: Collect /data directory state
      ansible.builtin.stat:
        path: "{{ item }}"
      register: data_dirs
      loop:
        - "{{ data_root }}"
        - "{{ data_root }}/models"
        - "{{ data_root }}/datasets"
        - "{{ data_root }}/beekeeper"
      tags: [storage]

    - name: Data directories exist, are group ml, and are setgid
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.gid | int == ml_gid
          - item.stat.mode == '2775'
        fail_msg: >-
          {{ item.item }} is mode {{ item.stat.mode | default('absent') }}
          gid {{ item.stat.gid | default('n/a') }}; expected mode 2775 gid
          {{ ml_gid }}. Without setgid the shared tree rots as soon as two
          users write to it.
      loop: "{{ data_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: [storage]

    - name: nvidia-smi runs on the host
      ansible.builtin.command: nvidia-smi --query-gpu=name,pci.bus_id --format=csv,noheader
      register: smi
      changed_when: false
      tags: [nvidia]

    - name: Both GPUs are visible
      ansible.builtin.assert:
        that:
          - smi.stdout_lines | length == 2
          - "'3090' in smi.stdout"
          - "'3060' in smi.stdout"
        fail_msg: "Expected an RTX 3090 and an RTX 3060, got: {{ smi.stdout }}"
      tags: [nvidia]

    - name: Container toolkit is installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' nvidia-container-toolkit
      register: nct
      changed_when: false
      failed_when: "'ok installed' not in nct.stdout"
      tags: [nvidia]

    - name: Read apt holds
      ansible.builtin.command: apt-mark showhold
      register: holds
      changed_when: false
      tags: [nvidia, docker]

    - name: NVIDIA packages are pinned against unattended upgrades
      ansible.builtin.assert:
        that:
          - holds.stdout is search('nvidia')
        fail_msg: >-
          No nvidia package is held. An automatic driver upgrade desyncs the
          userspace libraries from the loaded kernel module and breaks every
          GPU container without warning (spec 3.6).
      tags: [nvidia]

    - name: Docker daemon state
      ansible.builtin.systemd_service:
        name: docker
      become: true
      register: dockersvc
      changed_when: false
      tags: [docker]

    - name: Docker is running and enabled
      ansible.builtin.assert:
        that:
          - dockersvc.status.ActiveState == 'active'
          - dockersvc.status.UnitFileState == 'enabled'
        fail_msg: "Docker is {{ dockersvc.status.ActiveState }}"
      tags: [docker]

    - name: Compose plugin is present
      ansible.builtin.command: docker compose version
      become: true
      register: composev
      changed_when: false
      tags: [docker]

    - name: GPUs are visible inside a container
      ansible.builtin.command: >-
        docker run --rm --gpus all
        nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi -L
      become: true
      register: cuda_smi
      changed_when: false
      tags: [docker]

    - name: Both GPUs are passed through to containers
      ansible.builtin.assert:
        that:
          - cuda_smi.stdout_lines | select('match', '^GPU') | list | length == 2
        fail_msg: >-
          Container sees {{ cuda_smi.stdout_lines | length }} GPU line(s).
          "Package installed" is not proof of a working toolkit; this is.
      tags: [docker]

    - name: Read the docker group
      ansible.builtin.getent:
        database: group
        key: docker
      tags: [docker]

    - name: robertcowher and llm can reach the docker socket
      ansible.builtin.assert:
        that:
          - "'robertcowher' in getent_group['docker'][2]"
          - "'llm' in getent_group['docker'][2]"
        fail_msg: >-
          docker group members are {{ getent_group['docker'][2] }};
          llama-swap runs as llm and spawns backend containers.
      tags: [docker]

    - name: Docker packages are held
      ansible.builtin.assert:
        that:
          - holds.stdout is search('docker-ce')
          - holds.stdout is search('containerd')
        fail_msg: "docker/containerd not held: {{ holds.stdout }}"
      tags: [docker]

    - name: Read ufw status
      ansible.builtin.command: ufw status verbose
      become: true
      register: ufwst
      changed_when: false
      tags: [firewall]

    - name: ufw denies by default and allows only the native LAN services
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufwst.stdout"
          - "'deny (incoming)' in ufwst.stdout"
          - ufwst.stdout is search('22')
          - ufwst.stdout is search('8080')
          - ufwst.stdout is search('5000')
          # The per-run TensorBoard range. Asserted as the range ufw actually
          # prints, not just '6006', so a rule that opened a single port would
          # fail here rather than pass and then strand the second run.
          - ufwst.stdout is search(tensorboard_port_range | regex_escape)
        fail_msg: "ufw is not in the expected state:\n{{ ufwst.stdout }}"
      tags: [firewall]

    - name: Read the DOCKER-USER chain
      ansible.builtin.command: iptables -S DOCKER-USER
      become: true
      register: duser
      changed_when: false
      tags: [firewall]

    - name: Container traffic is filtered, with return traffic preserved
      ansible.builtin.assert:
        that:
          - duser.stdout is search('RELATED,ESTABLISHED')
          - duser.stdout is search('dport 80')
          - duser.stdout is search('-i ' ~ wan_interface ~ ' -j DROP')
        fail_msg: >-
          DOCKER-USER does not enforce the container policy:
          {{ duser.stdout }}
      tags: [firewall]

    # This looks fussy but it checks a failure that presents as "containers
    # mysteriously cannot reach the internet" and is hard to diagnose after
    # the fact: DOCKER-USER sits in FORWARD, which also carries return
    # traffic for outbound container connections.
    - name: The conntrack RETURN precedes the DROP
      ansible.builtin.assert:
        that:
          - >-
            (duser.stdout_lines | select('search', 'RELATED,ESTABLISHED')
             | list | length) > 0
          - >-
            duser.stdout_lines.index(
              duser.stdout_lines | select('search', 'RELATED,ESTABLISHED') | first
            ) < duser.stdout_lines.index(
              duser.stdout_lines | select('search', '-j DROP') | first
            )
        fail_msg: >-
          The DROP rule precedes the conntrack RETURN. Containers will lose
          outbound networking with no error message.
      tags: [firewall]

    - name: The DOCKER-USER rules unit is enabled
      ansible.builtin.systemd_service:
        name: docker-user-rules
      become: true
      register: dursvc
      changed_when: false
      tags: [firewall]

    - name: Rules survive a docker restart because they are a unit
      ansible.builtin.assert:
        that:
          - dursvc.status.UnitFileState == 'enabled'
        fail_msg: >-
          docker-user-rules is {{ dursvc.status.UnitFileState }}. Docker
          recreates the DOCKER-USER chain on daemon restart, so these rules
          must be reapplied by a unit rather than set once.
      tags: [firewall]

    - name: Every declared environment exists at its pinned Python version
      ansible.builtin.command: "{{ conda_prefix }}/envs/{{ item.name }}/bin/python --version"
      register: envpy
      changed_when: false
      failed_when: item.python not in envpy.stdout
      loop: "{{ conda_envs }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [conda]

    - name: Conda is initialised for login shells
      ansible.builtin.stat:
        path: /etc/profile.d/conda.sh
      register: condaprofile
      tags: [conda]

    - name: Profile init exists rather than per-user bashrc edits
      ansible.builtin.assert:
        that:
          - condaprofile.stat.exists
        fail_msg: /etc/profile.d/conda.sh missing
      tags: [conda]

    - name: Inspect the conda prefix
      ansible.builtin.stat:
        path: "{{ conda_prefix }}"
      register: condaprefix
      tags: [conda]

    - name: The shared prefix is group ml and NOT group-writable
      ansible.builtin.assert:
        that:
          - condaprefix.stat.gid | int == ml_gid
          - condaprefix.stat.mode == '0755'
        fail_msg: >-
          {{ conda_prefix }} is mode {{ condaprefix.stat.mode }} gid
          {{ condaprefix.stat.gid }}. A group-writable prefix lets any ml
          member mutate the environment a running service depends on
          (spec 5.7).
      tags: [conda]

    - name: conda resolves in a login shell
      ansible.builtin.shell: bash -lc 'conda --version'
      register: condalogin
      changed_when: false
      tags: [conda]

    - name: base is not auto-activated
      ansible.builtin.shell: bash -lc 'echo "${CONDA_DEFAULT_ENV:-none}"'
      register: condabase
      changed_when: false
      tags: [conda]

    - name: A base env is not silently prepended to every shell PATH
      ansible.builtin.assert:
        that:
          - condabase.stdout | trim == 'none'
        fail_msg: >-
          base is auto-activated ({{ condabase.stdout | trim }}). That is how
          the wrong python ends up running a service.
      tags: [conda]

    - name: robertcowher has a writable envs directory
      ansible.builtin.shell: bash -lc 'conda config --show envs_dirs'
      become: true
      become_user: robertcowher
      register: envdirs
      changed_when: false
      tags: [conda]

    - name: Personal environments resolve to a writable path
      ansible.builtin.assert:
        that:
          - envdirs.stdout is search('/home/robertcowher/.conda/envs')
        fail_msg: >-
          envs_dirs is {{ envdirs.stdout }}. The shared prefix is read-only by
          design, so conda must fall back to ~/.conda/envs for personal
          environments.
      tags: [conda]

    - name: Apt tools are installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' {{ item }}
      register: tool_pkg
      changed_when: false
      failed_when: "'ok installed' not in tool_pkg.stdout"
      loop: "{{ tools_apt }}"
      tags: [tools]

    - name: nvitop runs and can read the GPUs
      ansible.builtin.command: /usr/local/bin/nvitop -1
      become: true
      register: nvitop_out
      changed_when: false
      tags: [tools]

    - name: nvitop exercised the driver, NVML, and the Python bindings
      ansible.builtin.assert:
        that:
          - nvitop_out.rc == 0
        fail_msg: "nvitop failed: {{ nvitop_out.stderr | default('') }}"
      tags: [tools]

    - name: Claude Code is installed for robertcowher
      ansible.builtin.command: /home/robertcowher/.local/bin/claude --version
      become: true
      become_user: robertcowher
      register: claude_v
      changed_when: false
      tags: [tools]

    - name: Claude Code reports a version
      ansible.builtin.assert:
        that:
          - claude_v.rc == 0
        fail_msg: "claude --version failed: {{ claude_v.stderr | default('') }}"
      tags: [tools]

    - name: llama-swap service state
      ansible.builtin.systemd_service:
        name: llama-swap
      become: true
      register: lsvc
      changed_when: false
      tags: [llama_swap]

    - name: llama-swap is active and enabled
      ansible.builtin.assert:
        that:
          - lsvc.status.ActiveState == 'active'
          - lsvc.status.UnitFileState == 'enabled'
        fail_msg: "llama-swap is {{ lsvc.status.ActiveState }}"
      tags: [llama_swap]

    - name: llama-swap answers over the LAN address
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8080/"
        status_code: [200, 302, 404]
      tags: [llama_swap]

    - name: Read the unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/llama-swap.service
      become: true
      register: lsunit
      tags: [llama_swap]

    - name: Device ordering is pinned and the service runs as llm
      ansible.builtin.assert:
        that:
          - "'CUDA_DEVICE_ORDER=PCI_BUS_ID' in (lsunit.content | b64decode)"
          - "'User=llm' in (lsunit.content | b64decode)"
        fail_msg: >-
          The 3060 sorts first by PCI bus ID, so without an explicit
          CUDA_DEVICE_ORDER "GPU 0" is the smaller card (spec 3.5).
      tags: [llama_swap]

    - name: The installed config is valid
      ansible.builtin.command: >-
        /usr/local/bin/llama-swap -config /etc/llama-swap/config.yaml -validate
      register: lsvalid
      changed_when: false
      tags: [llama_swap]

    - name: Compose unit state
      ansible.builtin.systemd_service:
        name: docker-compose@webstack
      become: true
      register: wsvc
      changed_when: false
      tags: [webstack]

    - name: The webstack compose project is active and enabled
      ansible.builtin.assert:
        that:
          - wsvc.status.ActiveState == 'active'
          - wsvc.status.UnitFileState == 'enabled'
        fail_msg: "docker-compose@webstack is {{ wsvc.status.ActiveState }}"
      tags: [webstack]

    - name: Caddy serves Open WebUI at the root
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        status_code: [200, 302, 401]
        follow_redirects: none
      # Open WebUI takes tens of seconds to become ready, so when a handler has
      # just restarted the stack this races and Caddy answers 502. Retrying is
      # the assertion working, not a weakened one -- it still fails if the app
      # never comes back.
      register: webui_root
      retries: 20
      delay: 5
      until: webui_root.status in [200, 302, 401]
      tags: [webstack]

    - name: Caddy serves File Browser under /files
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/files/"
        status_code: [200, 302, 401]
        follow_redirects: none
      tags: [webstack]

    - name: /beekeeper/ redirects rather than proxying
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/beekeeper/"
        status_code: [301, 302]
        follow_redirects: none
      register: bkredir
      tags: [webstack]

    - name: The beekeeper redirect points at port 5000
      ansible.builtin.assert:
        that:
          - "':5000' in bkredir.location"
        fail_msg: >-
          /beekeeper must redirect to :5000, not proxy. Beekeeper has no
          subpath support and its escaped paths would silently match Open
          WebUI's routes (spec 3.2).
      tags: [webstack]

    - name: Enumerate listening TCP sockets
      ansible.builtin.command: ss -ltnH
      become: true
      register: sockets
      changed_when: false
      tags: [webstack]

    - name: No containerized service listens on a LAN address
      ansible.builtin.assert:
        that:
          - sockets.stdout is not search('0.0.0.0:3000')
          - sockets.stdout is not search('0.0.0.0:8081')
          - sockets.stdout is not search('0.0.0.0:9100')
          - sockets.stdout is not search('0.0.0.0:9400')
          - >-
            sockets.stdout is not
            search(ansible_default_ipv4.address | regex_escape ~ ':3000')
        fail_msg: >-
          A containerized service is bound to a LAN address. ufw cannot filter
          Docker published ports, so this is reachable from the LAN despite
          default-deny (spec 3.1).
      tags: [webstack]

    - name: All webstack containers are running and none are unhealthy
      ansible.builtin.command: >-
        docker ps --filter label=com.docker.compose.project=webstack
        --format {{ '{{.Names}}:{{.Status}}' }}
      become: true
      register: wcontainers
      changed_when: false
      tags: [webstack]

    - name: Six containers up, no unhealthy ones
      ansible.builtin.assert:
        that:
          # caddy, open-webui, filebrowser, dcgm-exporter, node-exporter, searxng
          - wcontainers.stdout_lines | length == 6
          - wcontainers.stdout is not search('unhealthy')
        fail_msg: "webstack containers: {{ wcontainers.stdout }}"
      tags: [webstack]

    - name: beekeeper service state
      ansible.builtin.systemd_service:
        name: beekeeper
      become: true
      register: bksvc
      changed_when: false
      tags: [beekeeper]

    - name: beekeeper is active and enabled
      ansible.builtin.assert:
        that:
          - bksvc.status.ActiveState == 'active'
          - bksvc.status.UnitFileState == 'enabled'
        fail_msg: "beekeeper is {{ bksvc.status.ActiveState }}"
      tags: [beekeeper]

    - name: The API answers on the port its consumers expect
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:5000/api/v1/busy"
        return_content: true
      register: busy
      tags: [beekeeper]

    - name: The busy endpoint returns valid JSON
      ansible.builtin.assert:
        that:
          - busy.json is defined
        fail_msg: >-
          /api/v1/busy did not return JSON. deploy.sh polls this endpoint
          before restarting, and the MCP config and generated agent SDKs both
          bake in this address (spec 3.2).
      tags: [beekeeper]

    - name: The service venv uses the conda 3.12 interpreter
      ansible.builtin.command: "{{ beekeeper_home }}/venv/bin/python --version"
      become: true
      become_user: beekeeper
      register: bkpy
      changed_when: false
      tags: [beekeeper]

    - name: beekeeper is not running on Python 3.13 or newer
      ansible.builtin.assert:
        that:
          - "'3.12' in bkpy.stdout"
        fail_msg: >-
          venv reports {{ bkpy.stdout }}. numpy<2.0 has no wheels above 3.12.
      tags: [beekeeper]

    - name: The sudoers drop-in parses
      ansible.builtin.command: /usr/sbin/visudo -cf /etc/sudoers.d/beekeeper
      become: true
      register: bksudo
      changed_when: false
      tags: [beekeeper]

    - name: Read the effective wait-online configuration
      ansible.builtin.command: systemctl cat systemd-networkd-wait-online.service
      become: true
      register: waitonline
      changed_when: false
      tags: [base]

    - name: Boot waits only for the primary link
      ansible.builtin.assert:
        that:
          - >-
            waitonline.stdout_lines
            | select('search', '^ExecStart=.*wait-online')
            | list | last is search('--any')
          - >-
            waitonline.stdout_lines
            | select('search', '^ExecStart=.*wait-online')
            | list | last is search('-i ' ~ wan_interface)
        fail_msg: >-
          The last effective ExecStart does not scope wait-online to
          {{ wan_interface }} with --any. An empty second NIC sits at
          no-carrier forever, so the unit burns its full timeout, delaying
          systemd-user-sessions and leaving /run/nologin in place -- SSH
          answers but refuses every non-root login for two minutes.
      tags: [base]

    - name: No stale nologin lock is present
      ansible.builtin.stat:
        path: /run/nologin
      register: nologin
      tags: [base]

    - name: Logins are permitted
      ansible.builtin.assert:
        that:
          - not nologin.stat.exists
        fail_msg: >-
          /run/nologin exists, so unprivileged SSH logins are refused. Boot
          did not finish cleanly, or a shutdown is pending.
      tags: [base]

    - name: The backend image is present
      ansible.builtin.command: "docker image inspect {{ llama_cpp_image }}"
      become: true
      register: backend_img
      changed_when: false
      tags: [llama_swap]

    - name: llama-swap advertises every declared model
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8080/v1/models"
        return_content: true
      register: adv
      tags: [llama_swap]

    - name: Every model in vars is served, and none hold VRAM at rest
      ansible.builtin.assert:
        that:
          - >-
            (adv.json.data | map(attribute='id') | sort)
            == (llama_models | map(attribute='name') | sort)
        fail_msg: >-
          llama-swap serves {{ adv.json.data | map(attribute='id') | list }},
          expected {{ llama_models | map(attribute='name') | list }}.
      tags: [llama_swap]

    - name: Models declare an eviction TTL
      ansible.builtin.assert:
        that:
          - item.ttl | default(llama_swap_ttl_default) | int > 0
            or item.gpus | default('') == 'device=0'
        fail_msg: >-
          {{ item.name }} has no TTL and is not pinned to the 3060. This box is
          primarily for RL: the 3090 must never be held indefinitely. A model
          that should stay resident has to live on the 3060 (gpus: device=0),
          which leaves the big card free for training.
      loop: "{{ llama_models }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]

    - name: Every model states its GPU placement explicitly
      ansible.builtin.assert:
        that:
          - item.gpus is defined
          - item.gpus in ['all', 'device=0', 'device=1']
        fail_msg: >-
          {{ item.name }} does not set a valid `gpus`. Use 'all' (both cards),
          'device=0' (3060) or 'device=1' (3090) -- docker indexes by PCI bus
          order, so device=0 is the SMALLER card. An unset value would let a
          model land on the 12GB card by default.
      loop: "{{ llama_models }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]

    - name: No model overrides llama.cpp's memory autotuner
      ansible.builtin.assert:
        that:
          - item.tensor_split is not defined
          - item.ngl is not defined
        fail_msg: >-
          {{ item.name }} sets tensor_split or ngl. Both disable llama.cpp's
          --fit, which is what lets a model size itself to whatever VRAM is
          actually free. `-ngl 99` aborts it outright: "n_gpu_layers already
          set by user to 99, abort". Together they are what made a big model
          OOM against the always-on 3060 model. --fit also measured FASTER
          than a hand-tuned split. Leave both unset.
      loop: "{{ llama_models }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]

    - name: Exactly one lane may be resident, and only on the small card
      ansible.builtin.assert:
        that:
          - item.gpus == 'device=0'
        fail_msg: >-
          {{ item.name }} is in the resident group but is not pinned to the
          3060. A never-evicted model on the 3090 would permanently deny the
          training card.
      loop: "{{ llama_models | selectattr('group', 'defined') | selectattr('group', 'eq', 'resident') | list }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [llama_swap]

# ansible-playbook exits 0 when a play matches no hosts. For a verification
# playbook that is the worst possible default: a typo in the inventory or the
# host pattern turns every assertion below into a silent pass. This play runs
# on localhost, always, and fails if the lab play did not actually execute.
- name: Guard against a silently empty verify run
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: The lab play must have run
      ansible.builtin.assert:
        that:
          - "'lab' in hostvars"
          - hostvars['lab'].verify_ran | default(false) | bool
        fail_msg: >-
          verify.yml matched no hosts, or the lab play did not run. Nothing was
          verified. Check the inventory path and the host pattern.
      tags: [always]
