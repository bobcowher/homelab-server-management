---
wan_interface: enp5s0
data_root: /data

# Docker bridge networks. Containers reaching a native service on the host
# arrive from here, not from lan_subnet, so they need their own firewall rule.
docker_bridge_subnet: 172.16.0.0/12

# Central. Host shipped as UTC; this is a deliberate change.
timezone: America/Chicago

lab_users:
  - name: robertcowher
    shell: /bin/bash
    groups: [ml, docker, sudo]
  - name: beekeeper
    shell: /bin/bash
    groups: [ml]
  - name: llm
    shell: /usr/sbin/nologin
    groups: [ml, docker]
  - name: files
    shell: /usr/sbin/nologin
    groups: []

nvidia_driver_branch: 595-server

# Packages held against automatic upgrades. An unattended driver bump moves
# the userspace libraries out from under the loaded kernel module and breaks
# every GPU container until reboot.
apt_hold_pattern: '^(nvidia|libnvidia|docker-ce|containerd)'

conda_prefix: /opt/conda
conda_envs:
  # beekeeper: the service environment. setup.sh finds python3.12 here.
  - name: beekeeper
    python: "3.12"
  # py312: general-purpose 3.12 for interactive work. Read-only like every
  # shared env; to install into it, clone it first:
  #   conda create -n mywork --clone py312
  # which lands in ~/.conda/envs and is writable.
  - name: py312
    python: "3.12"

tools_apt:
  # aria2 is here for model weights: Hugging Face shapes per-connection
  # throughput, so one stream decays to ~2 MB/s while 6 parallel ranges sustain
  # ~49 MB/s. scripts/fetch_model.sh uses it. See docs/RUNBOOK.md.
  - aria2
  - htop
  - nvtop
  - iotop
  - ncdu
  - tree
  - ripgrep
  - fd-find
  - pciutils
  - sysstat
  - tmux
  - jq
  - unzip
  - nvme-cli
  - smartmontools

tools_pipx:
  - nvitop

# --- inference backend ---------------------------------------------------
# llama.cpp publishes no CUDA build for Linux (its prebuilt Linux tarballs are
# ROCm/SYCL/Vulkan/CPU only), so the backend is the official CUDA container.
# That also keeps the CUDA toolkit off the host, where it would fight the
# apt-hold discipline around the driver.
llama_cpp_image: ghcr.io/ggml-org/llama.cpp:server-cuda

# Models are pulled by llama.cpp itself with -hf, cached here through a volume
# mount so a container restart does not re-download.
llama_cache_dir: "{{ data_root }}/models/hf-cache"

# Idle seconds before a model is evicted and its VRAM released. This box is
# primarily for RL, so inference must not squat on the GPUs.
llama_swap_ttl_default: 900

# Each entry becomes one llama-swap model. Give it EITHER:
#   hf:    "<user>/<repo>[:quant]"   -- llama.cpp downloads and caches it
#   file:  "<name>.gguf"             -- an existing file in /data/models
#
# GPU PLACEMENT -- ONE index space, everywhere:
#
#   index 0 = RTX 3060, 12GB, PCI 04:00.0
#   index 1 = RTX 3090, 24GB, PCI 0A:00.0
#
# That holds for `gpus`, for `tensor_split`, and for nvidia-smi. It is only
# true because the container is started with CUDA_DEVICE_ORDER=PCI_BUS_ID (see
# the role template). Without it, llama.cpp sorts fastest-first and silently
# reverses tensor_split relative to `gpus` -- the small card is index 0 here,
# which is the opposite of what CUDA would pick on its own. Do not remove that
# env var without also flipping every tensor_split below.
#
# Measured on this box, same prompt and harness (scripts/bench_model.sh),
# 200 generated tokens:
#
#   placement                    VRAM              prompt      generation
#   both cards (default)         18012 + 8747      409 tok/s   150 tok/s
#   3090 only, n_cpu_moe 20      16616             136 tok/s    83 tok/s
#   3060 only, 16k ctx           10779              65 tok/s    60 tok/s
#
# Spanning both cards nearly doubles generation because no expert weights cross
# PCIe to system RAM.
#
# No tensor_split is set on purpose. llama.cpp's --fit (on by default) reads
# free VRAM at load time and splits to match, which a static ratio cannot do:
# with the resident Gemma holding 8.3GB of the 3060, --fit put 2.5GB there and
# 23GB on the 3090 and ran at 159 tok/s -- FASTER than the hand-tuned 12,24
# split managed with the 3060 empty (150 tok/s).
#
# That is the counter-intuitive part worth remembering: -sm layer is pipelined,
# not parallel, so the 3060 is the slow link in the chain. Pushing MORE onto the
# small card costs generation speed. Leave the split to --fit.
#
# n_cpu_moe keeps the MoE weights of the first N layers on the CPU. It is the
# VRAM/throughput dial when a model does NOT fit in the 36GB combined pool;
# it is measured per model, never guessed. The default model no longer needs it.
llama_models:
  - name: laguna-xs-2.1
    # Weights were transferred over the LAN and sha256-verified against the
    # value Hugging Face reports, so this uses the local file rather than
    # re-pulling 19GB. New models should prefer `hf:`.
    file: Laguna-XS-2.1-Q4_K_M.gguf
    gpus: all              # both cards; 19GB of weights fit with room for KV
    ctx: 65536
    threads: 16
    args: "--jinja -fa on --swa-full --cache-type-k q8_0 --cache-type-v q8_0"
    # No n_cpu_moe: the combined 36GB pool holds the whole model, and dropping
    # the CPU offload is where the 83 -> 150 tok/s came from.

  # Coding / agent-harness model. Qwen3-Coder-30B-A3B is a Mixture-of-Experts
  # with only ~3B parameters active per token, so it generates far faster than
  # a dense 32B while scoring in the same class -- the right shape for this
  # hardware. Q6_K is effectively lossless against Q8 and still leaves ~11GB of
  # the 36GB pool for KV cache.
  #
  # Measured (200 tokens, with Gemma resident on the 3060): 160 tok/s prompt,
  # 104 tok/s generation. Slower than Laguna's 163 because Q6_K moves more
  # bytes per token than Laguna's Q4_K_M, which is the trade for the quality.
  - name: qwen3-coder
    file: Qwen3-Coder-30B-A3B-Instruct-Q6_K.gguf
    gpus: all
    ctx: 65536
    threads: 16
    # --jinja is required, not cosmetic: tool calling in a coding harness needs
    # the model's real chat template.
    args: "--jinja -fa on --cache-type-k q8_0 --cache-type-v q8_0"

  # --- the resident lane ---------------------------------------------------
  # General-purpose family model. Pinned to the 3060 and never evicted, so the
  # 3090 stays free for training: `group: resident` puts it in a persistent
  # llama-swap group that the big models cannot unload.
  #
  # Gemma 4 12B is the largest Gemma that fits the 12GB card, and it is also
  # the most capable one for this job: audio input is native only to E2B, E4B
  # and 12B, so the 26B and 31B would cost the card AND lose a modality.
  #
  # Take the QAT build specifically. These are quantization-AWARE trained --
  # Google trained them to be q4_0, so quality sits near bf16. A community Q6
  # of the same model would be larger and worse. q4_0 is the intended format
  # here, not a compromise.
  #
  # 6.5GB weights + 0.2GB vision projector leaves ~4.5GB for KV at 32k ctx.
  - name: gemma-4-12b
    file: gemma-4-12b-it-qat-q4_0.gguf
    mmproj: mmproj-gemma-4-12b-it-qat-q4_0.gguf   # image + audio input
    gpus: "device=0"       # the 3060
    ctx: 32768
    threads: 16
    # Ages out on the normal idle timer like everything else. It stays in the
    # `resident` group so a big model loading cannot evict it mid-conversation,
    # but idle VRAM goes back to the box.
    group: resident
    args: "--jinja -fa on --cache-type-k q8_0 --cache-type-v q8_0"

llama_swap_version: "253"
llama_swap_sha256: 91f4d0af56cd5471d0133d6f89db7a7db118a9cd6f8ecd2bbdffd50aa29e5eb6

# deploy.sh resets the checkout to origin/develop, so Ansible clones the same
# branch to avoid the two fighting. Change here if that ever moves to main.
beekeeper_branch: develop
beekeeper_home: /home/beekeeper/beekeeper

# TensorBoard, one per training run, on the first free port at or above 6006.
# The firewall opens this range to the LAN. Beekeeper itself scans as far as
# 6105, so this is a deliberate cap rather than a mirror of what it can use.
tensorboard_port_range: "6006:6016"

# --- Overnight power management ---------------------------------------------
#
# The box POWERS OFF overnight when nothing has used it recently, and stays off
# until someone presses the button. There is no scheduled wake.
#
# It suspended to S3 with an RTC wake for about two hours on 2026-09-07, until
# a suspend with 8.3GB resident on the 3060 corrupted both GPUs. Eight minutes
# later, on the next CUDA context creation:
#
#   NVRM: Xid 31, MMU Fault: ENGINE CE2_PBDMA0
#   NVRM: uvm encountered global fatal error 0x60, requiring os reboot
#   NVRM: Xid 154, GPU recovery action -> 0x2 (Node Reboot Required)
#
# Both cards needed a reboot and a training run crashed on the poisoned state.
# A cycle with idle GPUs was clean, so the suspect is the driver's VRAM
# save/restore under PreserveVideoMemoryAllocations=2 rather than S3 itself.
#
# Powering off sidesteps the whole class: a cold boot reinitialises the driver
# from nothing, so there is no saved VRAM to restore incorrectly. It also drops
# the RTC alarm, its UTC conversion, and the dependency on a BIOS wake feature.
# The wake was only ever worth having if it was free, and it was not.
#
# Tested end to end 2026-09-07 through the real systemd unit with no session
# connected: every veto clear, powered off at 19:11:02, cold boot clean with
# both GPUs healthy and zero Xid errors.
power_shutdown_enabled: true

# Hourly retry window. The check at 00:00 is usually the one that fires; the
# rest exist so a run still going at midnight only delays the shutdown instead
# of cancelling the whole night. After the window closes the box stays up until
# tomorrow -- deliberately, so it can never power off in the afternoon.
power_shutdown_window: "00..08"

# How far back "recent use" reaches. sysstat samples every 10 minutes, so this
# is the real resolution of the CPU and load history.
power_idle_window_minutes: 60

# Idle on this box measures ldavg-5 at 0.00-0.02 and CPU at ~0.05%. These sit
# roughly 25x and 100x above that floor: high enough that docker health checks
# and a nightly logrotate do not trip them, low enough that no real training or
# inference could hide underneath.
power_idle_load_max: "0.50"
power_idle_cpu_max: "5.0"

# `touch` this to skip tonight's shutdown. On /run, so it clears itself at the
# next boot -- forgetting to remove it costs one night, not every night.
power_override_flag: /run/lab-no-suspend

power_sysstat_dir: /var/log/sysstat
power_beekeeper_url: "http://127.0.0.1:5000/api/v1/busy"
power_llama_swap_unit: llama-swap
